# Triển khai tự động — chặng còn thiếu của chuỗi CI/CD.
#
# ═══════════════════════════════════════════════════════════════════════════
# VÌ SAO TỆP NÀY TỒN TẠI
# ═══════════════════════════════════════════════════════════════════════════
#
# Hai chữ cái trong "CI/CD" là hai việc hoàn toàn khác nhau, và trước tệp này
# dự án chỉ có chữ đầu:
#
#   CI  — mã có đúng không?          -> ci.yml, đã có
#   CD  — mã có TỚI ĐƯỢC người dùng? -> tệp này
#
# Không có CD thì việc triển khai là một chuỗi lệnh gõ tay, khác nhau mỗi lần,
# và chỉ một người trong nhóm biết cách làm. Đó không phải là một quy trình —
# đó là một điểm hỏng đơn lẻ có hình dạng con người.
#
# ═══════════════════════════════════════════════════════════════════════════
# ĐÍCH TRIỂN KHAI LÀ DOCKER COMPOSE, KHÔNG PHẢI KUBERNETES
# ═══════════════════════════════════════════════════════════════════════════
#
# Toàn bộ hệ thống nằm trong MỘT tệp docker-compose.yml và lên bằng MỘT lệnh.
# Vì thế CD ở đây làm đúng hai việc, và không giả vờ làm gì hơn:
#
#   1. Dựng, ký (cosign) và quét CVE từng ảnh, đẩy lên ghcr.io.
#   2. Sinh `docker-compose.release.yml` — bản compose đã GHIM ảnh theo
#      digest — rồi đính kèm vào lần chạy như một artifact.
#
# Máy đích chỉ cần tải tệp đó về và chạy:
#
#   docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
#
# Vì sao không có bước SSH tự động vào máy đích: nó cần một khoá riêng nằm
# trong secret của kho, và một máy đích luôn bật. Chừng nào chưa có cả hai,
# thêm bước đó chỉ tạo ra một job đỏ thường trực — mà một job đỏ thường trực
# dạy cả nhóm bỏ qua màu đỏ, kể cả lần đỏ thật.
name: CD

on:
  # Chỉ chạy SAU KHI CI đã xanh trên main. `workflow_run` chứ không phải
  # `push` — nếu dùng push thì CD chạy SONG SONG với CI, và có thể triển khai
  # xong một bản mã mà bộ test còn chưa chạy tới.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Phát hành tay: chọn phiên bản. Cần cho việc quay lui — lúc đó thứ ta muốn
  # phát hành là một thẻ CŨ, không phải HEAD.
  workflow_dispatch:
    inputs:
      # Tên `version` chứ không phải `phien-ban`: dấu gạch nối trong tên đầu vào
      # buộc mọi chỗ tham chiếu phải viết `inputs.phien-ban`, và dấu `-` cũng
      # chính là toán tử TRỪ trong cú pháp biểu thức của Actions. Nó chạy được,
      # nhưng một tên không cần dấu gạch nối thì không có gì để mà đọc nhầm.
      version:
        description: Thẻ ảnh (để trống = dùng SHA của commit hiện tại)
        required: false
        type: string

concurrency:
  # KHÔNG huỷ giữa chừng (`cancel-in-progress` không đặt): huỷ một lần đang
  # chạy có thể để lại nửa số ảnh đã ký và nửa số chưa. Xếp hàng chờ là hành
  # vi đúng ở đây, khác hẳn với CI nơi huỷ bản cũ là đúng.
  group: cd-${{ github.ref }}

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  dung-anh:
    name: Dựng ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - search-service
          - crawler-service
          - analytics-service
          # history / downloads / settings / football viết bằng Go — dựng ở
          # job `dung-anh-go` bên dưới (backend/go/Dockerfile). Cùng kho ảnh,
          # cùng thẻ, nên bước "Sinh docker-compose.release.yml" tìm được đủ
          # digest cho mọi service có khối `build:`.
    # Bỏ qua khi CI đỏ. Thiếu điều kiện này thì `workflow_run` vẫn kích hoạt
    # kể cả khi CI thất bại — và CD sẽ vui vẻ triển khai một bản mã hỏng.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      # Cần để ký ảnh bằng cosign ở chế độ keyless.
      id-token: write
    outputs:
      the: ${{ steps.phien-ban.outputs.the }}
      kho: ${{ steps.kho.outputs.duong-dan }}

    steps:
      - uses: actions/checkout@v7

      # Đường dẫn kho ảnh, ĐÃ HẠ VỀ CHỮ THƯỜNG.
      #
      # `github.repository_owner` giữ nguyên cách viết hoa của tài khoản GitHub
      # (`KietAnhCS`), nhưng Docker BẮT BUỘC tên kho phải viết thường. Dùng
      # thẳng biến đó làm buildx từ chối ngay ở bước dựng:
      #
      #     ERROR: failed to build: invalid tag
      #     "ghcr.io/KietAnhCS/search-engine:sha-...":
      #     repository name must be lowercase
      #
      # Tính MỘT lần ở đây rồi dùng lại cho cả bốn chỗ (dựng, ký, quét, ghim
      # ảnh vào overlay) — bốn chỗ tự hạ chữ thường riêng là bốn cơ hội để một
      # chỗ bị quên.
      - id: kho
        name: Xác định đường dẫn kho ảnh
        run: |
          echo "duong-dan=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/search-engine" >> "$GITHUB_OUTPUT"

      # Giá trị do người dùng gõ đi qua `env:` chứ không dán thẳng vào `run:`.
      # Dán thẳng nghĩa là Actions thay chuỗi đó vào mã shell TRƯỚC khi shell
      # chạy, nên một thẻ tên `a; rm -rf /` trở thành hai câu lệnh. Qua `env:`
      # thì nó chỉ còn là dữ liệu.
      - id: phien-ban
        name: Xác định thẻ phiên bản
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "the=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "the=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN, KHÔNG phải một Personal Access Token. Token này chỉ
          # sống trong đúng lần chạy này và chỉ có quyền đã khai ở `permissions`
          # bên trên. Một PAT thì sống mãi và thường có quyền rộng hơn nhiều.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: day
        name: Dựng và đẩy
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/java/Dockerfile
          push: true
          build-args: |
            MODULE=services/${{ matrix.service }}
            ARTIFACT=${{ matrix.service }}
          tags: |
            ${{ steps.kho.outputs.duong-dan }}/${{ matrix.service }}:${{ steps.phien-ban.outputs.the }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # SBOM và provenance: danh sách mọi thư viện trong ảnh, và bằng chứng
          # ảnh này được dựng ra từ đâu. Khi CVE tiếp theo được công bố, câu hỏi
          # đầu tiên là "ta có dùng thư viện đó không" — SBOM trả lời trong vài
          # giây thay vì vài giờ.
          sbom: true
          provenance: mode=max

      # Ký ảnh, chế độ keyless: danh tính đến từ OIDC của GitHub Actions, không
      # có khoá riêng nào phải lưu và phải xoay vòng.
      #
      # Vì sao đáng làm: nó biến câu hỏi "ảnh đang chạy ở production có phải
      # thứ ta đã dựng không" từ một niềm tin thành một phép kiểm chứng được.
      - name: Cài cosign
        uses: sigstore/cosign-installer@v3

      - name: Ký ảnh
        env:
          DIGEST: ${{ steps.day.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.kho.outputs.duong-dan }}/${{ matrix.service }}@${DIGEST}"

      # Quét CVE, và ở ĐÂY thì mức CRITICAL THẬT SỰ chặn.
      #
      # Khác với ci.yml, nơi quét là `continue-on-error`. Lý do khác nhau ở hai
      # chỗ: trong CI, một cổng đỏ thường trực (ảnh nền gần như luôn có vài CVE
      # chưa vá) sẽ bị vô hiệu hoá trong vòng một tuần. Ở đây thì chặn là đúng —
      # ranh giới cuối trước khi ảnh chạm vào một cụm thật.
      - name: Quét CVE, CHẶN nếu có mức CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.kho.outputs.duong-dan }}/${{ matrix.service }}:${{ steps.phien-ban.outputs.the }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # ═══════════════════════════════════════════════════════════════════════
  # Cùng job như `dung-anh` nhưng cho các service Go: khác đúng hai chỗ —
  # context là `./backend/go` và tham số hoá bằng build-arg `SERVICE` (tên
  # thư mục) thay vì `MODULE`/`ARTIFACT`. Tên ảnh vẫn là tên service trong
  # docker-compose.yml (`<dir>-service`) để bước ghim digest tìm ra.
  dung-anh-go:
    name: Dựng ${{ matrix.compose }} (Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compose: football-service, dir: football}
          - {compose: settings-service, dir: settings}
          - {compose: downloads-service, dir: downloads}
          - {compose: history-service, dir: history}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - id: kho
        name: Xác định đường dẫn kho ảnh
        run: |
          echo "duong-dan=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/search-engine" >> "$GITHUB_OUTPUT"

      - id: phien-ban
        name: Xác định thẻ phiên bản
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "the=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "the=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: day
        name: Dựng và đẩy
        uses: docker/build-push-action@v6
        with:
          context: ./backend/go
          push: true
          build-args: |
            SERVICE=${{ matrix.dir }}
          tags: |
            ${{ steps.kho.outputs.duong-dan }}/${{ matrix.compose }}:${{ steps.phien-ban.outputs.the }}
          cache-from: type=gha,scope=${{ matrix.compose }}
          cache-to: type=gha,mode=max,scope=${{ matrix.compose }}
          sbom: true
          provenance: mode=max

      - name: Cài cosign
        uses: sigstore/cosign-installer@v3

      - name: Ký ảnh
        env:
          DIGEST: ${{ steps.day.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.kho.outputs.duong-dan }}/${{ matrix.compose }}@${DIGEST}"

      - name: Quét CVE, CHẶN nếu có mức CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.kho.outputs.duong-dan }}/${{ matrix.compose }}:${{ steps.phien-ban.outputs.the }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # ═══════════════════════════════════════════════════════════════════════
  # Bản compose đã ghim ảnh theo DIGEST, không phải theo thẻ.
  #
  # Thẻ là một con trỏ di động: hai máy kéo ảnh ở hai thời điểm khác nhau có
  # thể chạy hai bản mã khác nhau dưới cùng một tên. Digest là mã băm của
  # chính nội dung ảnh — ghim nó là ghim đúng thứ vừa được quét và vừa được ký
  # ở job trên.
  ban-phat-hanh:
    name: Sinh bản compose ghim theo digest
    needs: [dung-anh, dung-anh-go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Cài crane
        uses: imjasonh/setup-crane@v0.4

      - name: Đăng nhập ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lớp phủ chỉ chứa `image:` và `pull_policy:`. Chạy chồng lên
      # docker-compose.yml gốc thì mọi thứ khác — mem_limit, healthcheck, biến
      # môi trường — giữ nguyên.
      #
      # VÌ SAO PHẢI CÓ `pull_policy: always`. Lớp phủ KHÔNG xoá được khối
      # `build:` của tệp gốc — phép ghép của Compose là hợp nhất, không phải
      # thay thế, và `docker compose config` xác nhận `build` vẫn còn nguyên
      # sau khi ghép. Với một service có CẢ `image` lẫn `build`, Compose mặc
      # định DỰNG khi ảnh chưa có sẵn trên máy thay vì kéo về. Trên máy đích —
      # nơi thường không có mã nguồn — đó là một lỗi khó hiểu, và tệ hơn: nó
      # vứt bỏ đúng cái ảnh vừa được quét CVE và ký ở job trên. `always` buộc
      # Compose kéo đúng digest đã ghim.
      # Danh sách service KHÔNG viết tay ở đây. Nó được hỏi thẳng
      # docker-compose.yml: mọi service có khối `build:` là mọi service cần một
      # ảnh. Viết tay lần thứ hai nghĩa là ngày nào đó thêm một service vào
      # compose mà quên thêm vào đây, và lớp phủ sẽ im lặng bỏ sót đúng service
      # đó — máy đích tự dựng nó từ mã nguồn thay vì kéo ảnh đã ký.
      - name: Liệt kê service cần ghim ảnh
        id: danh-sach
        env:
          ADMIN_API_KEY: chi-de-kiem-dinh-0123456789abcdef
        run: |
          services=$(docker compose -f docker-compose.yml config --format json \
            | jq -r '.services | to_entries[] | select(.value.build) | .key' \
            | sort)
          echo "$services"
          {
            echo 'ten<<EOF'
            echo "$services"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Sinh docker-compose.release.yml
        env:
          KHO: ${{ needs.dung-anh.outputs.kho }}
          THE: ${{ needs.dung-anh.outputs.the }}
          SERVICES: ${{ steps.danh-sach.outputs.ten }}
        run: |
          {
            echo "# Sinh tự động bởi .github/workflows/cd.yml — đừng sửa tay."
            echo "# Phiên bản: $THE"
            echo "services:"
            for svc in $SERVICES; do
              digest=$(crane digest "$KHO/$svc:$THE")
              echo "  $svc:"
              echo "    image: $KHO/$svc@$digest"
              echo "    pull_policy: always"
            done
          } > docker-compose.release.yml
          cat docker-compose.release.yml

      # Kiểm luôn tại chỗ: lớp phủ ghép được với tệp gốc thì mới đính kèm.
      # Không có bước này thì lỗi ghép chỉ lộ ra trên máy đích, lúc demo.
      - name: Kiểm lớp phủ ghép được với tệp gốc
        env:
          ADMIN_API_KEY: chi-de-kiem-dinh-0123456789abcdef
        run: |
          docker compose -f docker-compose.yml -f docker-compose.release.yml \
            config --quiet

      - uses: actions/upload-artifact@v4
        with:
          name: docker-compose-release
          path: docker-compose.release.yml
          retention-days: 30

      - name: Ghi hướng dẫn triển khai vào phần tóm tắt
        env:
          THE: ${{ needs.dung-anh.outputs.the }}
        run: |
          {
            echo "## Ảnh đã sẵn sàng — phiên bản \`$THE\`"
            echo
            echo "Tải artifact \`docker-compose-release\` về cạnh"
            echo "\`docker-compose.yml\`, rồi trên máy đích chạy:"
            echo
            echo '```bash'
            echo 'docker compose -f docker-compose.yml \'
            echo '               -f docker-compose.release.yml up -d'
            echo '```'
            echo
            echo "Toàn bộ 9 service, ba CSDL và ba service giám sát lên cùng"
            echo "một lệnh. Grafana ở http://localhost:3000, Prometheus ở"
            echo "http://localhost:9090."
          } >> "$GITHUB_STEP_SUMMARY"
