# Kiểm tra tự động mỗi lần đẩy mã lên hoặc mở pull request.
#
# VÌ SAO CẦN. Dự án có 521 bài test viết rất tốt, nhưng trước tệp này không ai
# chạy chúng tự động. Hệ quả đã xảy ra thật: một thay đổi bảo mật làm 9 bài test
# đỏ và ứng dụng không khởi động được, và lỗi đó tồn tại trong cây làm việc mà
# không có gì báo. Một bộ test không được chạy là một bộ test không tồn tại.
#
# BỐN CỔNG CHẶN của job `backend`, mỗi cổng bắt một loại hỏng khác nhau:
#
#   Cổng                 Bắt được gì                        Hỏng thì sao
#   ──────────────────── ────────────────────────────────── ────────────
#   521 bài test         Logic từng khối sai                Build đỏ
#   Độ phủ (JaCoCo)      Mã mới không có test               Build đỏ
#   Phân tích tĩnh       Lỗi mà test không chạy tới         Build đỏ
#   Chất lượng xếp hạng  Tìm kiếm tệ đi mà test vẫn xanh    Build đỏ
#
# Cổng thứ tư là cổng đặc thù của một hệ thống tìm kiếm: ba cổng đầu đều có thể
# xanh trong khi kết quả trả về cho người dùng đã tệ đi. Xem RankingQualityTest.
#
# ═══════════════════════════════════════════════════════════════════════════
# MỘT ĐIỀU KIỆN NGẦM MÀ CI TỪNG VẤP PHẢI SUỐT NHIỀU NGÀY
# ═══════════════════════════════════════════════════════════════════════════
#
# `run: ./mvnw ...` chỉ chạy được nếu tệp `mvnw` có BIT THỰC THI trong Git
# (mode 100755). Windows không theo dõi bit này, nên một tệp commit từ Windows
# mặc định là 100644, và trên runner Linux nó cho:
#
#     ./mvnw: Permission denied          (exit code 126)
#
# Kiểu hỏng này đặc biệt khó nhận ra: nó KHÔNG phải lỗi mã nguồn, chạy trên máy
# lập trình viên thì hoàn toàn bình thường, và thông báo lỗi không hề nhắc tới
# Git hay quyền tệp trong kho. Sửa một lần bằng:
#
#     git update-index --chmod=+x search-engine/mvnw
#
# Cùng lý do áp dụng cho deploy/kind/up.sh và down.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Huỷ các lần chạy cũ của cùng một nhánh khi có commit mới: không ai quan tâm
# kết quả của mã đã bị thay thế, và nó chiếm chỗ trong hàng đợi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quyền TỐI THIỂU ở cấp workflow. Mặc định của GitHub rộng hơn mức cần; khai báo
# hẹp ở đây rồi nới thêm ở từng job là nguyên tắc đặc quyền tối thiểu.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Cần để đẩy báo cáo SpotBugs lên tab Security dưới dạng SARIF.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # Tự lưu đệm kho thư viện Maven giữa các lần chạy. Không có dòng
          # này thì mỗi lần chạy đều tải lại toàn bộ phụ thuộc.
          cache: maven

      # `verify` chứ không phải `test`: pha verify mới chạy jacoco:check và
      # spotbugs:check. Chạy `test` là bỏ qua hai trong bốn cổng chặn.
      - name: Test, đo độ phủ và phân tích tĩnh
        working-directory: search-engine
        # -B (batch) tắt thanh tiến độ động, thứ chỉ có nghĩa trên terminal
        # thật và chỉ làm bẩn log của CI.
        run: ./mvnw -B clean verify

      # Đưa con số độ phủ vào phần tóm tắt của lần chạy, để đọc được ngay trên
      # trang Actions mà không phải tải tệp về rồi mở ra.
      - name: Tóm tắt độ phủ
        if: always()
        working-directory: search-engine
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "Không có báo cáo JaCoCo (build hỏng trước khi sinh được)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9}
            END {
              printf "## Độ phủ kiểm thử\n\n"
              printf "| Chỉ số | Đã phủ | Bỏ sót | Tỷ lệ |\n|---|---:|---:|---:|\n"
              printf "| Lệnh   | %d | %d | %.1f%% |\n", ic, im, 100*ic/(ic+im)
              printf "| Nhánh  | %d | %d | %.1f%% |\n", bc, bm, 100*bc/(bc+bm)
              printf "| Dòng   | %d | %d | %.1f%% |\n", lc, lm, 100*lc/(lc+lm)
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      # Cảnh báo phân tích tĩnh hiện thẳng trong tab Security và trong diff của
      # pull request, thay vì nằm trong một tệp XML không ai mở.
      - name: Đẩy kết quả SpotBugs lên tab Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: search-engine/target/spotbugsSarif.json
          category: spotbugs
        continue-on-error: true

      # Báo cáo test được đăng lên ngay cả khi bước trên THẤT BẠI — đó mới là
      # lúc cần đọc chúng. `if: always()` là bắt buộc, vì mặc định các bước sau
      # một bước hỏng đều bị bỏ qua.
      - name: Lưu báo cáo test và độ phủ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-backend
          path: |
            search-engine/target/surefire-reports/
            search-engine/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend (Electron + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-app/package-lock.json

      # `npm ci` chứ không phải `npm install`: nó cài ĐÚNG phiên bản ghi trong
      # package-lock.json và báo lỗi nếu lock lệch với package.json. Trên CI,
      # tính lặp lại được quan trọng hơn sự tiện lợi.
      - name: Cài đặt thư viện
        working-directory: browser-app
        run: npm ci
        env:
          # Bỏ qua bước tải bản chạy Electron (~100 MB): CI chỉ kiểm tra kiểu và
          # lint, không mở cửa sổ ứng dụng nào.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Kiểm tra kiểu
        working-directory: browser-app
        run: npm run typecheck

      - name: Lint
        working-directory: browser-app
        run: npm run lint

      # Cổng chặn thứ ba của frontend, và là cổng duy nhất kiểm HÀNH VI.
      #
      # `typecheck` chỉ nói kiểu dữ liệu khớp nhau; `lint` chỉ nói phong cách
      # nhất quán. Cả hai đều xanh trên một hàm trả về kết quả sai. Trước bước
      # này, hơn 5.000 dòng TypeScript — trong đó có chính sách điều hướng, tức
      # một RANH GIỚI BẢO MẬT — không có gì canh cả.
      #
      # Xem `src/main/urlPolicy.test.ts`: nó ghim lại việc `file://` và
      # `javascript:` phải bị từ chối. Nới lỏng phép kiểm tra đó "cho tiện" sẽ
      # làm build đỏ ngay tại pull request.
      - name: Test (Vitest)
        working-directory: browser-app
        run: npm test

  image:
    name: Dựng ảnh Docker và quét lỗ hổng
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Kustomize không cho tham chiếu tệp ngoài thư mục gốc, nên schema.sql
      # phải có một bản sao trong deploy/k8s/base. Bước này chặn hai bản lệch.
      - name: Chặn lệch schema.sql
        run: diff -u search-engine/src/main/resources/db/schema.sql deploy/k8s/base/schema.sql

      - uses: docker/setup-buildx-action@v3

      # Chỉ DỰNG ảnh, không đẩy lên đâu cả — việc đẩy là của release.yml. Mục
      # đích ở đây là bắt lỗi Dockerfile sớm: một Dockerfile hỏng chỉ lộ ra lúc
      # triển khai thì đã quá muộn.
      #
      # `load: true` nạp ảnh vào Docker cục bộ của runner để bước quét bên dưới
      # có cái mà quét. Không có dòng này thì buildx dựng xong rồi vứt đi.
      - name: Dựng ảnh
        uses: docker/build-push-action@v6
        with:
          context: ./search-engine
          push: false
          load: true
          tags: vnsearch-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Quét CVE trong ảnh — thư viện hệ thống của ảnh nền, không chỉ phụ thuộc
      # Java. Dependabot không nhìn thấy tầng này.
      #
      # KHÔNG chặn build ở đây: ảnh nền `eclipse-temurin` gần như luôn có vài
      # CVE chưa có bản vá, và một cổng chặn đỏ thường trực sẽ bị vô hiệu hoá
      # trong vòng một tuần. Kết quả đẩy lên tab Security để theo dõi; việc chặn
      # phát hành nằm ở release.yml, nơi mức CRITICAL mới thực sự chặn.
      - name: Quét lỗ hổng bằng Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vnsearch-backend:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
        continue-on-error: true

      - name: Đẩy kết quả Trivy lên tab Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # Test tích hợp Kafka — chạy với một broker THẬT
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Job RIÊNG, chạy song song với job `backend`, vì hai lý do:
  #
  #   1. Nó chậm (dựng broker mất ~15 giây) và job chính phải nhanh — nó là
  #      thứ lập trình viên chờ để biết mã có xanh không.
  #   2. Nó hỏng vì những lý do KHÁC: Docker không có, kéo ảnh thất bại, mạng
  #      chậm. Trộn vào job chính thì một sự cố hạ tầng CI trông y hệt một lỗi
  #      mã nguồn.
  #
  # Ba thứ chỉ job này bắt được — bộ test in-process về nguyên tắc không thể:
  # thông điệp có serialize được không (Instant cần JavaTimeModule), phân
  # hoạch theo host có ổn định không, và thông điệp lớn có qua nổi trần không.
  kafka-integration:
    name: Tích hợp Kafka (Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Hồ sơ `kafka-it` đảo ngược bộ lọc nhóm test: chỉ chạy @Tag("kafka-it").
      # Nhờ vậy job này mất khoảng một phút thay vì chạy lại 490 bài đã chạy ở
      # job `backend`. Hai cổng chặn nặng (JaCoCo, SpotBugs) cũng tắt trong hồ
      # sơ đó — xem pom.xml.
      - name: Chạy test tích hợp
        working-directory: search-engine
        run: ./mvnw -B verify -Pkafka-it

      - name: Lưu báo cáo test tích hợp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-kafka-it
          path: search-engine/target/surefire-reports/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Kiểm định HẠ TẦNG — bắt lỗi YAML trước khi nó chạm vào một cụm thật
  # ═══════════════════════════════════════════════════════════════════════
  #
  # VÌ SAO CẦN. YAML hạ tầng có một tính chất khó chịu: nó hỏng ở nơi xa nhất
  # so với nơi viết ra. Một `replicas: "2"` (chuỗi thay vì số) hay một
  # `apiVersion` gõ sai chỉ lộ ra lúc `kubectl apply`, tức lúc đang triển
  # khai — và nếu đó là production thì đã quá muộn.
  #
  # Job này bắt chúng trong khoảng 30 giây, không cần cụm nào.
  infrastructure:
    name: Kiểm định manifest và cấu hình giám sát
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- Kubernetes -----------------------------------------------------

      - name: Cài kubeconform
        run: |
          curl -sSfL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      # `kustomize build` một mình đã bắt được lỗi cú pháp và patch trỏ vào
      # tài nguyên không tồn tại. Chạy cho CẢ BA lớp: một patch chỉ có ở
      # overlay dev sẽ không lộ ra khi chỉ dựng lớp nền.
      - name: Dựng cả ba lớp kustomize
        run: |
          for lop in base overlays/dev overlays/prod; do
            echo "::group::deploy/k8s/$lop"
            kubectl kustomize "deploy/k8s/$lop" > "/tmp/$(echo "$lop" | tr / -).yaml"
            echo "::endgroup::"
          done
          kubectl kustomize deploy/k8s/monitoring > /tmp/monitoring.yaml

      # kubeconform đối chiếu với lược đồ THẬT của Kubernetes — bắt được thứ
      # mà kustomize không thấy: sai kiểu dữ liệu, thiếu trường bắt buộc, dùng
      # apiVersion đã bị gỡ bỏ.
      #
      # `-strict` từ chối cả trường thừa. Đây là chỗ bắt lỗi gõ sai tên trường:
      # không có nó, `replicaz: 3` được chấp nhận im lặng và Deployment chạy
      # với số bản sao mặc định.
      #
      # ScaledObject (KEDA), ServiceMonitor và PrometheusRule là CRD, không có
      # trong lược đồ chuẩn — `-ignore-missing-schemas` bỏ qua chúng thay vì
      # báo đỏ. Đánh đổi có ý thức: chúng vẫn được `kustomize build` kiểm cú
      # pháp ở bước trên.
      - name: Đối chiếu lược đồ Kubernetes
        run: |
          for tep in /tmp/base.yaml /tmp/overlays-dev.yaml /tmp/overlays-prod.yaml /tmp/monitoring.yaml; do
            echo "::group::$tep"
            kubeconform -strict -summary -ignore-missing-schemas \
              -kubernetes-version 1.30.0 "$tep"
            echo "::endgroup::"
          done

      # --- Prometheus -----------------------------------------------------

      # Một biểu thức PromQL sai cú pháp làm Prometheus TỪ CHỐI NẠP CẢ TỆP quy
      # tắc — nghĩa là mất toàn bộ cảnh báo, không chỉ cái viết sai. Và nó thất
      # bại im lặng: Prometheus vẫn chạy, vẫn thu thập, chỉ là không cảnh báo
      # gì nữa. Đúng loại hỏng mà không ai phát hiện cho tới khi cần cảnh báo.
      # Mount vào ĐÚNG /etc/prometheus, không phải một thư mục tuỳ ý.
      #
      # `check config` đọc `rule_files:` bên trong prometheus.yml và đi theo
      # đường dẫn ghi ở đó — vốn là đường dẫn TUYỆT ĐỐI trong container thật
      # (/etc/prometheus/alerts.yml). Mount vào /work thì đường dẫn ấy không
      # tồn tại và bước này báo đỏ vì một lý do hoàn toàn giả.
      #
      # Đây là một lỗi đã xảy ra thật khi viết tệp này, và nó đáng ghi lại:
      # công cụ kiểm định chỉ có ích khi nó chạy trong đúng bối cảnh mà thứ
      # nó kiểm sẽ chạy.
      - name: Kiểm tra cấu hình Prometheus và quy tắc cảnh báo
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/deploy/monitoring:/etc/prometheus" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

      - name: Kiểm tra cấu hình Alertmanager
        run: |
          docker run --rm --entrypoint amtool \
            -v "${{ github.workspace }}/deploy/monitoring:/etc/alertmanager" \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      # --- Docker Compose -------------------------------------------------

      # Kiểm cả ba mức profile. Một dịch vụ chỉ có trong profile `monitoring`
      # mà tham chiếu một volume chưa khai báo sẽ không lộ ra khi chỉ kiểm
      # cấu hình mặc định.
      - name: Kiểm định docker-compose ở cả ba mức
        env:
          ADMIN_API_KEY: chi-de-kiem-dinh-0123456789abcdef
        run: |
          docker compose config --quiet
          docker compose --profile kafka config --quiet
          docker compose --profile kafka --profile monitoring config --quiet

      # --- Chống lệch giữa hai bản quy tắc --------------------------------

      # deploy/monitoring/alerts.yml và deploy/k8s/monitoring/prometheusrule.yaml
      # mô tả CÙNG một bộ cảnh báo cho hai đường triển khai. Chúng không thể
      # dùng chung một tệp (khác định dạng, và kustomize không tham chiếu được
      # tệp ngoài thư mục gốc), nên phải có một bước canh cho chúng không lệch.
      #
      # So theo TÊN cảnh báo chứ không so nguyên văn: hai bản cố ý khác nhau ở
      # phần runbook (`kubectl` so với `docker compose`) và bản Kubernetes có
      # thêm hai cảnh báo chỉ có nghĩa trên cụm.
      #
      # Cùng cơ chế mà bước "Chặn lệch schema.sql" ở job trên đang dùng.
      - name: Chặn lệch giữa hai bản quy tắc cảnh báo
        run: |
          thieu=0
          for ten in $(grep -oP '(?<=- alert: )\w+' deploy/monitoring/alerts.yml); do
            if ! grep -q "alert: $ten" deploy/k8s/monitoring/prometheusrule.yaml; then
              echo "::error::Cảnh báo '$ten' có trong compose nhưng THIẾU ở bản Kubernetes"
              thieu=1
            fi
          done
          if [ "$thieu" -eq 1 ]; then
            echo "Hai bản quy tắc đã lệch nhau — xem đầu tệp prometheusrule.yaml."
            exit 1
          fi
          echo "Hai bản quy tắc khớp nhau."
