# Kiểm tra tự động mỗi lần đẩy mã lên hoặc mở pull request.
#
# VÌ SAO CẦN. Dự án có 521 bài test viết rất tốt, nhưng trước tệp này không ai
# chạy chúng tự động. Hệ quả đã xảy ra thật: một thay đổi bảo mật làm 9 bài test
# đỏ và ứng dụng không khởi động được, và lỗi đó tồn tại trong cây làm việc mà
# không có gì báo. Một bộ test không được chạy là một bộ test không tồn tại.
#
# BỐN CỔNG CHẶN của backend, mỗi cổng bắt một loại hỏng khác nhau. Chúng nằm
# trong HAI job chạy song song, vì phân tích tĩnh không cần chờ test và ngược
# lại: tách ra thì thời gian chờ của một pull request bằng nhánh CHẬM NHẤT chứ
# không bằng tổng hai nhánh. Tách còn cho biết ngay hỏng thuộc loại nào — chỉ
# cần đọc tên job đỏ.
#
#   Cổng                 Bắt được gì                        Job
#   ──────────────────── ────────────────────────────────── ────────────────
#   521 bài test         Logic từng khối sai                backend-test
#   Độ phủ (JaCoCo)      Mã mới không có test               backend-test
#   Chất lượng xếp hạng  Tìm kiếm tệ đi mà test vẫn xanh    backend-test
#   Phân tích tĩnh       Lỗi mà test không chạy tới         backend-static
#
# Cả bốn cổng hỏng đều làm build đỏ. Cổng "chất lượng xếp hạng" là cổng đặc thù
# của một hệ thống tìm kiếm: ba cổng kia đều có thể xanh trong khi kết quả trả
# về cho người dùng đã tệ đi. Xem RankingQualityTest.
#
# ═══════════════════════════════════════════════════════════════════════════
# MỘT ĐIỀU KIỆN NGẦM MÀ CI TỪNG VẤP PHẢI SUỐT NHIỀU NGÀY
# ═══════════════════════════════════════════════════════════════════════════
#
# `run: ./mvnw ...` chỉ chạy được nếu tệp `mvnw` có BIT THỰC THI trong Git
# (mode 100755). Windows không theo dõi bit này, nên một tệp commit từ Windows
# mặc định là 100644, và trên runner Linux nó cho:
#
#     ./mvnw: Permission denied          (exit code 126)
#
# Kiểu hỏng này đặc biệt khó nhận ra: nó KHÔNG phải lỗi mã nguồn, chạy trên máy
# lập trình viên thì hoàn toàn bình thường, và thông báo lỗi không hề nhắc tới
# Git hay quyền tệp trong kho. Sửa một lần bằng:
#
#     git update-index --chmod=+x backend/java/mvnw

#
# ═══════════════════════════════════════════════════════════════════════════
# VÌ SAO CI CHẠY JDK 21 TRONG KHI MÃ NHẮM JAVA 17
# ═══════════════════════════════════════════════════════════════════════════
#
# Hai con số này KHÁC NHAU một cách có chủ ý:
#
#   java.version = 17   (pom.xml)  -> BYTECODE sinh ra nhắm Java 17,
#                                     nên ảnh Docker chạy trên JRE 17 vẫn đúng
#   java-version = 21   (tệp này)  -> JVM CHẠY Maven, SpotBugs, JaCoCo
#
# Vì sao phải là 21: máy phát triển chạy JDK 21, và SpotBugs cho kết quả KHÁC
# NHAU giữa hai bản JDK trên cùng một mã nguồn. Chuyện đã xảy ra thật —
# `./mvnw verify` trên máy báo 0 bug, còn CI (khi đó dùng JDK 17) báo 1 bug
# UC_USELESS_OBJECT trong PageRankService. Bug đó CÓ THẬT, nhưng việc chỉ một
# bên thấy nó nghĩa là "xanh trên máy" không nói lên điều gì về CI.
#
# Nguyên tắc: JVM chạy công cụ phân tích phải GIỐNG NHAU hai bên. Còn phiên bản
# bytecode đích thì thuộc về pom.xml, không thuộc về tệp này.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Huỷ các lần chạy cũ của cùng một nhánh khi có commit mới: không ai quan tâm
# kết quả của mã đã bị thay thế, và nó chiếm chỗ trong hàng đợi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quyền TỐI THIỂU ở cấp workflow. Mặc định của GitHub rộng hơn mức cần; khai báo
# hẹp ở đây rồi nới thêm ở từng job là nguyên tắc đặc quyền tối thiểu.
permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Backend, nhánh 1/2 — test và độ phủ
  # ═══════════════════════════════════════════════════════════════════════
  #
  # `-Dspotbugs.skip=true` ở đây KHÔNG phải là nới lỏng cổng chặn: SpotBugs vẫn
  # chạy đầy đủ, chỉ là ở job `backend-static` song song. Bỏ nó ra khỏi nhánh
  # này để kết quả test về sớm hơn — đây là nhánh lập trình viên thực sự ngồi
  # chờ.
  backend-test:
    name: 'Backend: test + độ phủ'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Tự lưu đệm kho thư viện Maven giữa các lần chạy. Không có dòng
          # này thì mỗi lần chạy đều tải lại toàn bộ phụ thuộc.
          cache: maven

      # `verify` chứ không phải `test`: pha verify mới chạy jacoco:check và
      # sinh báo cáo gộp. Chạy `test` là bỏ qua cổng độ phủ.
      - name: Test và đo độ phủ
        working-directory: backend/java
        # -B (batch) tắt thanh tiến độ động, thứ chỉ có nghĩa trên terminal
        # thật và chỉ làm bẩn log của CI.
        run: ./mvnw -B clean verify -Dspotbugs.skip=true

      # Đưa con số độ phủ vào phần tóm tắt của lần chạy, để đọc được ngay trên
      # trang Actions mà không phải tải tệp về rồi mở ra.
      #
      # Đường dẫn phải là báo cáo GỘP của module `coverage`. Trong reactor đa
      # module, `backend/java/target/site/jacoco/` KHÔNG BAO GIỜ tồn tại: mỗi module
      # sinh báo cáo trong target của chính nó, còn thư mục gốc không chứa mã
      # nguồn nào. Trỏ sai chỗ thì bước này im lặng in "không có báo cáo" ở mọi
      # lần chạy, và phần tóm tắt trông như thể độ phủ chưa từng được đo.
      - name: Tóm tắt độ phủ
        if: always()
        working-directory: backend/java
        run: |
          CSV=coverage/target/site/jacoco-aggregate/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "Không có báo cáo JaCoCo (build hỏng trước khi sinh được)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9}
            END {
              printf "## Độ phủ kiểm thử\n\n"
              printf "| Chỉ số | Đã phủ | Bỏ sót | Tỷ lệ |\n|---|---:|---:|---:|\n"
              printf "| Lệnh   | %d | %d | %.1f%% |\n", ic, im, 100*ic/(ic+im)
              printf "| Nhánh  | %d | %d | %.1f%% |\n", bc, bm, 100*bc/(bc+bm)
              printf "| Dòng   | %d | %d | %.1f%% |\n", lc, lm, 100*lc/(lc+lm)
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      # Báo cáo test được đăng lên ngay cả khi bước trên THẤT BẠI — đó mới là
      # lúc cần đọc chúng. `if: always()` là bắt buộc, vì mặc định các bước sau
      # một bước hỏng đều bị bỏ qua.
      - name: Lưu báo cáo test và độ phủ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-backend
          path: |
            backend/**/target/surefire-reports/
            backend/java/coverage/target/site/jacoco-aggregate/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Backend, nhánh 2/2 — phân tích tĩnh
  # ═══════════════════════════════════════════════════════════════════════
  #
  # `-DskipTests -Djacoco.skip=true`: SpotBugs đọc BYTECODE, nó không cần bài
  # test nào chạy cả, và JaCoCo chỉ có nghĩa khi có test. Bỏ hai thứ đó đi thì
  # nhánh này còn lại đúng phần biên dịch, nên `-T 1C` (mỗi lõi một luồng
  # reactor) an toàn: không module nào tranh nhau cổng hay container như lúc
  # chạy test.
  backend-static:
    name: 'Backend: phân tích tĩnh (SpotBugs)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Cần để đẩy báo cáo SpotBugs lên tab Security dưới dạng SARIF.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Phân tích tĩnh
        working-directory: backend/java
        run: ./mvnw -B -T 1C clean verify -DskipTests -Djacoco.skip=true

      # Cảnh báo phân tích tĩnh hiện thẳng trong tab Security và trong diff của
      # pull request, thay vì nằm trong một tệp XML không ai mở.
      # Reactor đa module sinh một spotbugsSarif.json cho MỖI module, nằm rải
      # ở backend/*/*/target/. Action upload-sarif nhận một thư mục, không nhận
      # một mẫu glob — nên phải gom lại. Đổi tên theo module để hai tệp không
      # đè nhau: cả mười module đều sinh ra đúng một cái tên.
      - name: Gom báo cáo SpotBugs
        if: always()
        run: |
          mkdir -p backend/sarif
          find backend -name spotbugsSarif.json -print0 | while IFS= read -r -d '' f; do
            module=$(echo "$f" | sed -E 's|backend/java/(.*)/target/.*|\1|; s|/|-|g')
            cp "$f" "backend/sarif/${module}.sarif"
          done
          ls -la backend/sarif || true

      - name: Đẩy kết quả SpotBugs lên tab Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          # Reactor đa module: mỗi module sinh một tệp SARIF riêng. Gộp ở đây
          # thay vì đẩy từng tệp — tab Security hiện một danh sách chứ không
          # phải mười danh sách rời.
          sarif_file: backend/sarif/
          category: spotbugs
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # Backend Go — football-service và tầng platform dùng chung
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Job RIÊNG với chuỗi công cụ riêng: `go build` / `go vet` / `go test`.
  # football/settings/downloads/history viết lại từ Java sang Go (chi + pgx /
  # mongo-driver) để cắt ~300 MB RAM JVM mỗi service; tất cả dùng chung một
  # module `backend/go`.
  #
  # gofmt là cổng chặn: mã lệch định dạng làm diff nhiễu và không có công cụ
  # nào khác bắt được.
  #
  # Bước "tích hợp CSDL" thay cho job `data-integration` (Testcontainers) đã bỏ:
  # nó dựng Postgres/Mongo THẬT bằng dockertest và kiểm những thứ chỉ CSDL thật
  # bắt được — ràng buộc CHECK, phép gộp jsonb `||`, chỉ mục TTL của Mongo.
  # Chạy được vì runner ubuntu-latest có sẵn Docker; thiếu Docker thì test tự
  # `t.Skip`.
  backend-go:
    name: 'Backend Go: build + vet + test'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go/go.sum

      - name: gofmt
        working-directory: backend/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Các tệp chưa gofmt:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend/go
        run: go vet ./...

      - name: go test
        working-directory: backend/go
        run: go test -race ./...

      - name: go test (tích hợp CSDL — Postgres/Mongo thật qua dockertest)
        working-directory: backend/go
        run: go test -tags=integration -timeout 10m ./...

  frontend:
    name: Frontend (Electron + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      # `npm ci` chứ không phải `npm install`: nó cài ĐÚNG phiên bản ghi trong
      # package-lock.json và báo lỗi nếu lock lệch với package.json. Trên CI,
      # tính lặp lại được quan trọng hơn sự tiện lợi.
      - name: Cài đặt thư viện
        working-directory: desktop-app
        run: npm ci
        env:
          # Bỏ qua bước tải bản chạy Electron (~100 MB): CI chỉ kiểm tra kiểu và
          # lint, không mở cửa sổ ứng dụng nào.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Kiểm tra kiểu
        working-directory: desktop-app
        run: npm run typecheck

      - name: Lint
        working-directory: desktop-app
        run: npm run lint

      # Cổng chặn thứ ba của frontend, và là cổng duy nhất kiểm HÀNH VI.
      #
      # `typecheck` chỉ nói kiểu dữ liệu khớp nhau; `lint` chỉ nói phong cách
      # nhất quán. Cả hai đều xanh trên một hàm trả về kết quả sai. Trước bước
      # này, hơn 5.000 dòng TypeScript — trong đó có chính sách điều hướng, tức
      # một RANH GIỚI BẢO MẬT — không có gì canh cả.
      #
      # Xem `src/main/urlPolicy.test.ts`: nó ghim lại việc `file://` và
      # `javascript:` phải bị từ chối. Nới lỏng phép kiểm tra đó "cho tiện" sẽ
      # làm build đỏ ngay tại pull request.
      - name: Test (Vitest)
        working-directory: desktop-app
        run: npm test

  image:
    name: Dựng ảnh Docker và quét lỗ hổng
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Chỉ DỰNG ảnh, không đẩy lên đâu cả — việc đẩy thuộc về hai workflow
      # khác: cd.yml (thẻ `sha-...`, sau mỗi lần CI xanh trên main) và
      # release.yml (thẻ semver và `latest`, mỗi lần đặt thẻ `v*.*.*`). Mục
      # đích ở đây là bắt lỗi Dockerfile sớm: một Dockerfile hỏng chỉ lộ ra lúc
      # triển khai thì đã quá muộn.
      #
      # `load: true` nạp ảnh vào Docker cục bộ của runner để bước quét bên dưới
      # có cái mà quét. Không có dòng này thì buildx dựng xong rồi vứt đi.
      - name: Dựng ảnh
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/java/Dockerfile
          push: false
          load: true
          tags: vnsearch-backend:ci
          # Dockerfile CÓ giá trị mặc định cho MODULE/ARTIFACT, nhưng dựa vào
          # mặc định nghĩa là CI dựng một ảnh khác với ảnh mà cd.yml và
          # release.yml dựng — hai workflow đó luôn truyền build-arg tường
          # minh. Ghi rõ ở đây để cả ba nơi dựng đúng cùng một thứ.
          build-args: |
            MODULE=services/search-service
            ARTIFACT=search-service
          # Scope riêng: bộ đệm gha không có scope thì dùng chung khoá với các
          # workflow khác, nên ảnh của cd.yml/release.yml ghi đè qua lại và
          # hầu như lần nào cũng trượt đệm.
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      # Quét CVE trong ảnh — thư viện hệ thống của ảnh nền, không chỉ phụ thuộc
      # Java. Dependabot không nhìn thấy tầng này.
      #
      # KHÔNG chặn build ở đây: ảnh nền `eclipse-temurin` gần như luôn có vài
      # CVE chưa có bản vá, và một cổng chặn đỏ thường trực sẽ bị vô hiệu hoá
      # trong vòng một tuần. Kết quả đẩy lên tab Security để theo dõi; việc chặn
      # nằm ở CẢ HAI workflow đẩy ảnh — cd.yml và release.yml — nơi mức CRITICAL
      # mới thực sự làm job đỏ và ảnh không đi xa hơn được.
      - name: Quét lỗ hổng bằng Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vnsearch-backend:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
        continue-on-error: true

      - name: Đẩy kết quả Trivy lên tab Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy
        continue-on-error: true

  # Job "Tích hợp CSDL" (Testcontainers cho downloads/history/settings) đã bỏ:
  # ba service đó viết lại bằng Go (backend/go), phần logic được phủ bởi job
  # `backend-go`. Test tích hợp Postgres/Mongo thật cho bản Go (qua dockertest)
  # là việc còn nợ — xem backend/go.

  # ═══════════════════════════════════════════════════════════════════════
  # Test tích hợp Kafka — chạy với một broker THẬT
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Job RIÊNG, chạy song song với hai job backend, vì hai lý do:
  #
  #   1. Nó chậm (dựng broker mất ~15 giây) và job chính phải nhanh — nó là
  #      thứ lập trình viên chờ để biết mã có xanh không.
  #   2. Nó hỏng vì những lý do KHÁC: Docker không có, kéo ảnh thất bại, mạng
  #      chậm. Trộn vào job chính thì một sự cố hạ tầng CI trông y hệt một lỗi
  #      mã nguồn.
  #
  # Ba thứ chỉ job này bắt được — bộ test in-process về nguyên tắc không thể:
  # thông điệp có serialize được không (Instant cần JavaTimeModule), phân
  # hoạch theo host có ổn định không, và thông điệp lớn có qua nổi trần không.
  kafka-integration:
    name: Tích hợp Kafka (Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Hồ sơ `kafka-it` đảo ngược bộ lọc nhóm test: chỉ chạy @Tag("kafka-it").
      # Nhờ vậy job này mất khoảng một phút thay vì chạy lại 490 bài đã chạy ở
      # job `backend-test`. Hai cổng chặn nặng (JaCoCo, SpotBugs) cũng tắt
      # trong hồ sơ đó — xem pom.xml.
      #
      # libs/core-crawler là module DUY NHẤT có test gắn nhãn ấy, nên `-pl` cắt
      # reactor xuống đúng nó, còn `-am` dựng trước các thư viện nó phụ thuộc.
      - name: Chạy test tích hợp
        working-directory: backend/java
        run: ./mvnw -B verify -Pkafka-it -pl libs/core-crawler -am

      - name: Lưu báo cáo test tích hợp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-kafka-it
          path: backend/**/target/surefire-reports/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Kiểm định HẠ TẦNG — bắt lỗi YAML trước khi nó làm hỏng buổi demo
  # ═══════════════════════════════════════════════════════════════════════
  #
  # VÌ SAO CẦN. YAML hạ tầng có một tính chất khó chịu: nó hỏng ở nơi xa nhất
  # so với nơi viết ra. Một biểu thức PromQL sai cú pháp hay một service tham
  # chiếu volume chưa khai báo chỉ lộ ra lúc `docker compose up` — tức là lúc
  # đang đứng trước hội đồng.
  #
  # Job này bắt chúng trong khoảng 30 giây, không cần chạy thật.
  infrastructure:
    name: Kiểm định cấu hình Compose và giám sát
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- Prometheus -----------------------------------------------------

      # Một biểu thức PromQL sai cú pháp làm Prometheus TỪ CHỐI NẠP CẢ TỆP quy
      # tắc — nghĩa là mất toàn bộ cảnh báo, không chỉ cái viết sai. Và nó thất
      # bại im lặng: Prometheus vẫn chạy, vẫn thu thập, chỉ là không cảnh báo
      # gì nữa. Đúng loại hỏng mà không ai phát hiện cho tới khi cần cảnh báo.
      # Mount vào ĐÚNG /etc/prometheus, không phải một thư mục tuỳ ý.
      #
      # `check config` đọc `rule_files:` bên trong prometheus.yml và đi theo
      # đường dẫn ghi ở đó — vốn là đường dẫn TUYỆT ĐỐI trong container thật
      # (/etc/prometheus/alerts.yml). Mount vào /work thì đường dẫn ấy không
      # tồn tại và bước này báo đỏ vì một lý do hoàn toàn giả.
      #
      # Đây là một lỗi đã xảy ra thật khi viết tệp này, và nó đáng ghi lại:
      # công cụ kiểm định chỉ có ích khi nó chạy trong đúng bối cảnh mà thứ
      # nó kiểm sẽ chạy.
      - name: Kiểm tra cấu hình Prometheus và quy tắc cảnh báo
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/deploy/monitoring:/etc/prometheus" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

      - name: Kiểm tra cấu hình Alertmanager
        run: |
          docker run --rm --entrypoint amtool \
            -v "${{ github.workspace }}/deploy/monitoring:/etc/alertmanager" \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      # --- Docker Compose -------------------------------------------------

      # Giám sát và Kafka đều nằm sau hồ sơ riêng, nên phải kiểm cả bốn tổ hợp:
      # không hồ sơ nào, từng hồ sơ một, và cả hai cùng lúc. Một hồ sơ chỉ được
      # hợp lệ khi bật RIÊNG nó vẫn hợp lệ — service trong hồ sơ có thể tham
      # chiếu một service mặc định, nhưng không được tham chiếu hồ sơ kia.
      - name: Kiểm định docker-compose
        env:
          ADMIN_API_KEY: chi-de-kiem-dinh-0123456789abcdef
        run: |
          docker compose config --quiet
          docker compose --profile kafka config --quiet
          docker compose --profile monitoring config --quiet
          docker compose --profile kafka --profile monitoring config --quiet

      # Ma trận service trong cd.yml và release.yml là hai bản chép tay của
      # cùng một danh sách đã nằm sẵn trong docker-compose.yml. Chúng lệch nhau
      # theo kiểu KHÔNG ai thấy: thêm một service vào compose mà quên thêm vào
      # ma trận thì cả hai workflow vẫn xanh, chỉ là service đó không bao giờ
      # có ảnh — và điều đó chỉ lộ ra trên máy đích, lúc nó cố tự dựng từ mã
      # nguồn không có ở đó.
      - name: Đối chiếu ma trận service với docker-compose
        env:
          ADMIN_API_KEY: chi-de-kiem-dinh-0123456789abcdef
        run: |
          docker compose config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json, sys, yaml

          with open('/tmp/compose.json') as f:
              compose = json.load(f)
          expected = sorted(n for n, s in compose['services'].items() if 'build' in s)

          # Anh Java va anh Go duoc dung boi HAI job khac nhau trong cung mot
          # workflow, va hai job do khai bao ma tran theo hai kieu khac nhau:
          # job Java dung `matrix.service` (danh sach ten), job Go dung
          # `matrix.include` (moi phan tu co `compose` va `dir`). Doi chieu
          # phai gop CA HAI, khong thi bon service Go luon bi bao la thieu.
          targets = {
              '.github/workflows/cd.yml': [('dung-anh', 'service'),
                                           ('dung-anh-go', 'compose')],
              '.github/workflows/release.yml': [('anh-docker', 'service'),
                                                ('anh-docker-go', 'compose')],
          }
          bad = False
          for path, jobs in targets.items():
              with open(path, encoding='utf-8') as f:
                  wf = yaml.safe_load(f)
              actual = []
              for job, key in jobs:
                  matrix = wf['jobs'][job]['strategy']['matrix']
                  if 'include' in matrix:
                      actual += [muc[key] for muc in matrix['include']]
                  else:
                      actual += matrix[key]
              actual = sorted(actual)
              ten_job = ' + '.join(job for job, _ in jobs)
              if actual != expected:
                  bad = True
                  print(f'{path} (job {ten_job}) lech voi docker-compose.yml')
                  print('  thieu : ', sorted(set(expected) - set(actual)))
                  print('  thua  : ', sorted(set(actual) - set(expected)))
              else:
                  print(f'{path} (job {ten_job}) khop: {len(actual)} service')
          sys.exit(1 if bad else 0)
          PY
