# ============================================================================
# analytics-service :8084 — số liệu sử dụng và bảng điều khiển quản trị.
# ============================================================================
spring.config.import=classpath:vnsearch-common.properties

# Xem chú thích về `#---` trong application.properties của auth-service.
#---

spring.application.name=analytics-service
server.port=${SERVER_PORT:8084}

# --- Bảo mật ---
# Có /api/admin/analytics nên khoá quản trị là bắt buộc: đây là lối vào dự
# phòng để đọc số liệu khi auth-service hỏng.
app.security.require-admin-api-key=true

# --- Địa chỉ các service được gọi tới ---
# Địa chỉ NỘI BỘ, không đi qua Gateway. Đi qua Gateway sẽ thêm một chặng mạng,
# một lần kiểm JWT nữa, và — tệ nhất — một vòng phụ thuộc: Gateway gọi
# analytics-service, analytics-service lại gọi ngược Gateway.
app.clients.crawler-service.url=${CRAWLER_SERVICE_URL:http://crawler-service:8083}
app.clients.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

# --- Bộ nhớ ---
# Số liệu sử dụng nằm TRONG BỘ NHỚ và chỉ giữ 24 giờ. Đây là lựa chọn có chủ ý
# cho một service được cấp 384 MB: một kho số liệu bền vững cần CSDL chuỗi thời
# gian, và đó là một hệ thống khác, không phải một bảng thêm vào.
#
# Hệ quả phải chấp nhận: khởi động lại là mất số liệu, và nhiều bản sao thì mỗi
# bản có số của riêng nó. Nguồn số liệu ĐÚNG cho vận hành là Prometheus
# (/actuator/prometheus); bảng điều khiển này là thứ để liếc, không phải để
# báo cáo.
