# ============================================================================
# Profile `postgres` — bật kho tài khoản trên PostgreSQL.
# ============================================================================
#
#     SPRING_PROFILES_ACTIVE=postgres
#
# VÌ SAO LÀ MỘT PROFILE CHỨ KHÔNG PHẢI MỘT BIẾN MÔI TRƯỜNG BẬT/TẮT. Chuyển
# sang PostgreSQL không phải một công tắc mà là BỐN thay đổi phải xảy ra CÙNG
# LÚC: gỡ loại trừ DataSource, gỡ loại trừ Flyway, đổi app.auth.store, và có
# đủ thông tin kết nối. Thiếu một trong bốn thì service hoặc không khởi động,
# hoặc — tệ hơn — khởi động rồi âm thầm ghi tài khoản vào tệp JSON trong khi
# người vận hành tin rằng nó đang ghi vào CSDL.
#
# Gói cả bốn vào một cái tên duy nhất thì không thể bật một nửa.

# Gỡ phần loại trừ của profile mặc định. Chép lại đúng dòng loại trừ
# UserDetailsService — Spring lấy DANH SÁCH của tệp ưu tiên cao hơn chứ không
# hợp nhất hai danh sách, nên bỏ sót nó ở đây sẽ làm dòng log
# "Using generated security password" quay lại.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.auth.store=postgres

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://postgres:5432/vnsearch_auth}
spring.datasource.username=${AUTH_DB_USER:vnsearch_auth}
spring.datasource.password=${AUTH_DB_PASSWORD:}

# Bể kết nối NHỎ, có chủ ý.
#
# auth-service phục vụ đăng nhập và gia hạn token — thao tác ngắn, và phần đắt
# nhất của nó (BCrypt ~200 ms) tốn CPU chứ không tốn kết nối. Mười kết nối là
# thừa cho tải thật, còn mặc định của HikariCP là 10 nhân với số bản sao, và
# PostgreSQL thì mỗi kết nối tốn vài megabyte bộ nhớ phía máy chủ. Trên một
# máy 8 GB chạy cả tám service, những megabyte đó cộng lại thành vấn đề thật.
spring.datasource.hikari.maximum-pool-size=${AUTH_DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# BẬT: Flyway kiểm tra checksum của mọi tệp đã chạy trước khi chạy tệp mới.
# Đây là cổng chặn phát hiện việc ai đó sửa một tệp migration cũ — thứ làm
# lệch lược đồ giữa các môi trường mà không để lại dấu vết nào.
spring.flyway.validate-on-migrate=true
# Tạo bảng lịch sử nếu schema đang trống, thay vì từ chối chạy. Cần cho lần
# triển khai đầu tiên vào một CSDL mới tinh.
spring.flyway.baseline-on-migrate=true

# --- Refresh token ---
# Đã có hạ tầng thật thì cũng dùng kho refresh token thật: kho trong bộ nhớ
# làm mọi người bị đăng xuất sau mỗi lần triển khai.
app.auth.refresh-store=${AUTH_REFRESH_STORE:redis}
