# ============================================================================
# crawler-service :8083 — điều khiển crawl, tiêu thụ bus Kafka.
# ============================================================================
spring.config.import=classpath:vnsearch-common.properties

# Xem chú thích về `#---` trong application.properties của auth-service: tài
# liệu SAU thắng tài liệu TRƯỚC, và tệp được import chèn ngay dưới tài liệu
# khai báo import.
#---

spring.application.name=crawler-service
server.port=${SERVER_PORT:8083}

# --- Bảo mật ---
# BẮT BUỘC có khoá quản trị. Toàn bộ bề mặt của service này nằm dưới
# /api/admin/**, và POST /api/admin/crawl khiến máy chủ đi tải một URL do
# người gọi chọn. Chạy không khoá là mở một máy quét cổng cho bất kỳ ai.
app.security.require-admin-api-key=true

# CHẶT: 20 request/phút. Đây không phải endpoint mà người dùng bấm liên tục —
# một lần khởi động crawl chạy hàng phút. Tần suất cao ở đây hoặc là script
# hỏng, hoặc là ai đó đang dò.
app.security.rate-limit.requests-per-minute=${CRAWLER_RATE_LIMIT:20}

# --- Đường dẫn dữ liệu ---
app.index.data-path=${APP_INDEX_PATH:data/index.json}
app.crawler.data-path=${APP_CRAWLER_DATA_PATH:data/crawled-documents.json}
app.seed.data-path=${APP_SEED_PATH:data/seed-documents.json}
app.search.cache-size=50

# --- Kho tài liệu ---
app.storage.postgres.enabled=${APP_STORAGE_POSTGRES_ENABLED:false}
app.storage.postgres.url=${APP_STORAGE_POSTGRES_URL:jdbc:postgresql://postgres:5432/vnsearch}
app.storage.postgres.user=${APP_STORAGE_POSTGRES_USER:vnsearch}
app.storage.postgres.password=${POSTGRES_PASSWORD:vnsearch}

# --- Bus sự kiện crawler -> Modular Service ---
#
# `memory`: ba Modular Service chạy trong CÙNG tiến trình, gọi trực tiếp.
#           Không cần broker. Đây là mặc định, và là chế độ mà run-crawl.bat,
#           MultiDomainCrawlRunner và toàn bộ test dùng.
#
# `kafka` : chúng chạy ở tiến trình RIÊNG, co giãn độc lập.
#
# VÌ SAO MẶC ĐỊNH LÀ `memory`. Một hệ thống không khởi động được khi thiếu
# broker là một hệ thống không demo được, không test được, và không ai chạy thử
# được. Kafka phải là thứ BẬT THÊM khi cần quy mô, không phải điều kiện để chạy
# được dòng đầu tiên.
app.crawler.bus=${APP_CRAWLER_BUS:memory}
app.crawler.kafka.bootstrap-servers=${APP_CRAWLER_KAFKA_BOOTSTRAP:kafka:9092}

# Bốn topic cho bốn luồng khác nhau — xem Javadoc của
# com.vnsearch.crawler.bus.OutlinksExtracted về việc vì sao `urls.discovered`
# và `outlinks` KHÔNG thể gộp làm một.
app.crawler.kafka.topic.pages=vnsearch.pages
app.crawler.kafka.topic.urls=vnsearch.urls.discovered
app.crawler.kafka.topic.outlinks=vnsearch.outlinks
app.crawler.kafka.topic.images=vnsearch.images

# Số phân hoạch = TRẦN số tiến trình xử lý song song của một consumer group.
# Kafka giao mỗi phân hoạch cho đúng MỘT consumer, nên 12 phân hoạch nghĩa là
# nhiều nhất 12 bản sao làm việc; bản thứ 13 nằm không.
#
# Vì sao 12 chứ không phải 3: tăng số phân hoạch của một topic đang chạy sẽ LÀM
# HỎNG phép phân hoạch theo khoá — cùng một host sẽ bắt đầu rơi vào một phân
# hoạch khác, và bộ lọc Bloom theo host (xem DiscoveredUrl) mất tính đúng. Nên
# phải đặt đủ rộng ngay từ đầu. 12 là bội số của 1, 2, 3, 4, 6 nên chia đều
# được cho nhiều cấu hình số bản sao.
app.crawler.kafka.partitions=12
app.crawler.kafka.replication-factor=${APP_CRAWLER_KAFKA_REPLICATION:1}

# Mỗi Modular Service MỘT nhóm consumer riêng — đó là cơ chế phát tán
# một-tới-nhiều: ba nhóm cùng đọc một topic, mỗi nhóm giữ offset riêng, nên cả
# ba đều nhận được TOÀN BỘ luồng trang.
app.crawler.kafka.group.url-extractor=vnsearch-url-extractor
app.crawler.kafka.group.image-download=vnsearch-image-download
app.crawler.kafka.group.analytics=vnsearch-analytics
app.crawler.kafka.group.frontier=vnsearch-frontier-feeder
app.crawler.kafka.group.image-store=vnsearch-image-store

# Vai trò của tiến trình. `worker`: chỉ tiêu thụ Kafka, KHÔNG nạp ImageStore —
# kho ảnh nằm trong bộ nhớ tiến trình và chỉ được nạp ở tiến trình phục vụ API
# (search-service). Nạp ở cả hai là tốn gấp đôi RAM cho hai bản sao không bao
# giờ được đọc.
app.crawler.role=${APP_CRAWLER_ROLE:worker}
app.crawler.role.is-api=${APP_CRAWLER_ROLE_IS_API:false}

# --- Image Download Service ---
# Mặc định CHỈ ghi siêu dữ liệu, không tải nội dung ảnh. Ba lý do (chi phí băng
# thông, bề mặt SSRF, bản quyền) ghi trong Javadoc của ImageFound.
app.crawler.images.download=${APP_CRAWLER_IMAGES_DOWNLOAD:false}
app.crawler.images.max-per-page=50
app.crawler.images.max-bytes=5242880
