# ============================================================================
# downloads-service :8086 - so tai xuong (PostgreSQL).
# ============================================================================
spring.config.import=classpath:vnsearch-common.properties

# Xem chu thich ve `#---` trong application.properties cua auth-service: tai
# lieu SAU thang tai lieu TRUOC, va tep duoc import chen ngay duoi tai lieu
# khai bao import.
#---

spring.application.name=downloads-service
server.port=${SERVER_PORT:8086}

app.security.require-admin-api-key=false

# --- CSDL ---
# Luoc do RIENG. Khong dung chung voi auth-service: mot lo hong o day khong
# duoc phep cham toi bang mat khau.
spring.datasource.url=${DOWNLOADS_DB_URL:jdbc:postgresql://postgres:5432/vnsearch_downloads}
spring.datasource.username=${DOWNLOADS_DB_USER:vnsearch_downloads}
spring.datasource.password=${DOWNLOADS_DB_PASSWORD:}

# Be ket noi NHO. Service nay duoc cap 384 MB va chi lam CRUD ngan; moi ket noi
# PostgreSQL ton vai megabyte o phia may chu, va tren mot may 8 GB chay ca tam
# service thi nhung megabyte do cong lai thanh van de that.
spring.datasource.hikari.maximum-pool-size=${DOWNLOADS_DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
