spring.config.import=classpath:vnsearch-common.properties
spring.application.name=football-service
server.port=${SERVER_PORT:8090}

# Dùng chung CSDL `vnsearch` với search-service nhưng trong một schema riêng
# tên `football`. Cắt service này ra CSDL riêng về sau chỉ là đổi một URL.
spring.datasource.url=${FOOTBALL_DB_URL:jdbc:postgresql://${FOOTBALL_DB_HOST:postgres}:${FOOTBALL_DB_PORT:5432}/${FOOTBALL_DB_NAME:vnsearch}}
spring.datasource.username=${FOOTBALL_DB_USER:vnsearch}
spring.datasource.password=${FOOTBALL_DB_PASSWORD:${POSTGRES_PASSWORD:vnsearch}}
spring.datasource.hikari.maximum-pool-size=5

# Flyway tự tạo schema `football` rồi chạy migration BÊN TRONG nó, nên các
# lệnh CREATE TABLE trong V1 không cần ghi tiền tố schema.
spring.flyway.enabled=true
spring.flyway.schemas=football
spring.flyway.create-schemas=true
# Schema `football` có thể đã tồn tại và có sẵn bảng — bản Go của service này
# tự chạy CREATE TABLE IF NOT EXISTS, không hề có bảng lịch sử của Flyway. Gặp
# schema như vậy Flyway DỪNG với "Found non-empty schema(s) but no schema
# history table", và cả service chết lúc khởi động. Baseline coi phần đang có
# là mốc gốc rồi chạy tiếp từ V2 — ba bảng của bản Go trùng khớp với V1 nên
# không mất gì. Cùng cấu hình mà downloads-service và settings-service đang dùng.
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

football.api-base-url=${FOOTBALL_API_BASE_URL:https://v3.football.api-sports.io}
football.api-key=${FOOTBALL_API_KEY:}
football.daily-budget=${FOOTBALL_DAILY_BUDGET:95}
football.request-timeout=${FOOTBALL_REQUEST_TIMEOUT:10s}
football.live-ttl=${FOOTBALL_LIVE_TTL:15m}
football.season-ttl=${FOOTBALL_SEASON_TTL:24h}
football.metadata-ttl=${FOOTBALL_METADATA_TTL:7d}

# Mọi endpoint ở đây đều CHỈ ĐỌC và không mang danh tính người dùng, nên
# không có phiên đăng nhập nào để mượn — không cần khoá quản trị.
app.security.require-admin-api-key=false
