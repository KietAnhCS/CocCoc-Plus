# ============================================================================
# history-service :8085 — lich su duyet web va tim kiem (MongoDB).
# ============================================================================
spring.config.import=classpath:vnsearch-common.properties

# Xem chu thich ve `#---` trong application.properties cua auth-service.
#---

spring.application.name=history-service
server.port=${SERVER_PORT:8085}

# --- MongoDB ---
spring.data.mongodb.uri=${MONGO_URI:mongodb://mongo:27017/vnsearch_history}

# TU TAO CHI MUC tu cac annotation @Indexed/@CompoundIndex luc khoi dong.
#
# MAC DINH CUA SPRING LA TAT, va do la mot mac dinh dung cho he thong lon: tao
# chi muc tren mot collection hang tram trieu ban ghi se khoa collection do
# hang phut, va khong ai muon dieu do xay ra tu dong luc trien khai.
#
# Bat o day vi ba ly do cu the:
#   - collection nay khong bao gio lon den muc do (TTL 90 ngay giu no nho),
#   - chi muc TTL la thu MA THIEU NO SE HONG AM THAM: khong co no thi du lieu
#     ca nhan nam lai vinh vien va khong ai nhan ra,
#   - noi chi muc vao ma nguon (annotation) thay vi vao mot script rieng nghia
#     la chung khong bao gio lech nhau.
spring.data.mongodb.auto-index-creation=true

# --- Bao mat ---
# Khong co /api/admin/** nao o service nay.
app.security.require-admin-api-key=false

# --- Bo nho ---
# Duoc cap 384 MB. Service nay khong giu gi trong heap ngoai bo dem ket noi:
# moi truy van deu di thang xuong Mongo va tra ve mot trang ket qua co gioi
# han. Do la ly do no chay duoc trong mot container nho.
