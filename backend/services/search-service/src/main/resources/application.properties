# ============================================================================
# search-service :8082 — truy vấn, gợi ý, ảnh, bảng tin.
# ============================================================================
spring.config.import=classpath:vnsearch-common.properties

# Dấu `#---` tách tệp thành HAI tài liệu cấu hình. Tệp được import chèn ngay
# dưới tài liệu khai báo import, và tài liệu SAU thắng tài liệu TRƯỚC — nên mọi
# khoá của service phải nằm ở tài liệu thứ hai thì phép ghi đè mới có tác dụng.
#---

spring.application.name=search-service
server.port=${SERVER_PORT:8082}

# --- Xếp hạng ---
# Scorer cơ sở: tfidf | bm25 (xem ScorerFactory).
app.ranking.scorer=${APP_RANKING_SCORER:tfidf}
app.ranking.bm25.k1=1.2
app.ranking.bm25.b=0.75
# Trọng số các tín hiệu bổ sung, áp bằng Decorator. Đặt 0 để tắt hẳn một tín
# hiệu — lớp bọc tương ứng sẽ không được tạo, không tốn chi phí.
app.ranking.beta=0.30
app.ranking.gamma=0.10

# --- Đường dẫn dữ liệu ---
app.index.data-path=${APP_INDEX_PATH:data/index.json}
app.crawler.data-path=${APP_CRAWLER_DATA_PATH:data/crawled-documents.json}
app.seed.data-path=${APP_SEED_PATH:data/seed-documents.json}

# Cache LRU cho truy vấn. 200 mục là con số ĐO ĐƯỢC chứ không phải đoán: phân
# bố truy vấn có đuôi dài, và 200 mục nóng nhất đã chiếm phần lớn lượt trúng.
# Tăng lên không cải thiện đáng kể tỉ lệ trúng nhưng ăn thêm heap — thứ khan
# hiếm nhất ở service này.
app.search.cache-size=${APP_SEARCH_CACHE:200}

# --- Kho tài liệu ---
# Mặc định tắt để service khởi động được khi không có CSDL. Bật lên thì
# PostgreSQL thành nguồn ưu tiên, JSON làm dự phòng.
app.storage.postgres.enabled=${APP_STORAGE_POSTGRES_ENABLED:false}
app.storage.postgres.url=${APP_STORAGE_POSTGRES_URL:jdbc:postgresql://postgres:5432/vnsearch}
app.storage.postgres.user=${APP_STORAGE_POSTGRES_USER:vnsearch}
app.storage.postgres.password=${POSTGRES_PASSWORD:vnsearch}

# --- Bus sự kiện ---
# `memory`: các Modular Service chạy trong CÙNG tiến trình, gọi trực tiếp.
# `kafka` : chúng chạy ở tiến trình RIÊNG, cần một broker.
#
# search-service chỉ TIÊU THỤ topic ảnh (ImageStoreListener) để phục vụ
# GET /api/images. Nó không sinh ra sự kiện nào.
app.crawler.bus=${APP_CRAWLER_BUS:memory}
app.crawler.kafka.bootstrap-servers=${APP_CRAWLER_KAFKA_BOOTSTRAP:kafka:9092}
app.crawler.kafka.topic.images=vnsearch.images
# Nhóm RIÊNG cho kho ảnh. Dùng chung nhóm với analytics thì hai bên CHIA NHAU
# luồng thay vì mỗi bên nhận đủ — xem ImageStoreListener.
app.crawler.kafka.group.image-store=vnsearch-image-store

# Vai trò của tiến trình: `api` phục vụ truy vấn, `worker` chỉ tiêu thụ Kafka.
# ImageStore nằm trong bộ nhớ tiến trình, nên nó chỉ được nạp ở ĐÚNG MỘT nơi —
# và nơi đó phải là tiến trình phục vụ API.
app.crawler.role=api
app.crawler.role.is-api=true

# --- Bảo mật ---
# KHÔNG có /api/admin/** ở service này (điều khiển crawl thuộc crawler-service,
# số liệu thuộc analytics-service), nên khoá quản trị là tuỳ chọn.
app.security.require-admin-api-key=false

# --- Bộ nhớ ---
# Nhắc cho người đọc cấu hình, vì con số thật nằm ở deploy/: service này được
# cấp 1536 MB, gấp bốn lần history/downloads/settings. Chỉ mục đảo, Trie gợi ý
# và vector PageRank đều nằm trong heap, và chúng lớn theo kích thước corpus
# chứ không theo số người dùng.
