# ============================================================================
# settings-service :8087 - tuy chon nguoi dung (PostgreSQL + JSONB).
# ============================================================================
spring.config.import=classpath:vnsearch-common.properties

# Xem chu thich ve `#---` trong application.properties cua auth-service.
#---

spring.application.name=settings-service
server.port=${SERVER_PORT:8087}

app.security.require-admin-api-key=false

# --- CSDL ---
spring.datasource.url=${SETTINGS_DB_URL:jdbc:postgresql://postgres:5432/vnsearch_settings}
spring.datasource.username=${SETTINGS_DB_USER:vnsearch_settings}
spring.datasource.password=${SETTINGS_DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=${SETTINGS_DB_POOL:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
