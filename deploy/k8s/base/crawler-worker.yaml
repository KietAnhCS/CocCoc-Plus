# Crawler worker — cụm Modular Services chạy thành tiến trình riêng.
#
# ═══════════════════════════════════════════════════════════════════════════
# VÌ SAO TÁCH KHỎI BACKEND, KHI CẢ HAI DÙNG CHUNG MỘT ẢNH
# ═══════════════════════════════════════════════════════════════════════════
#
# Vì hai công việc có hồ sơ tài nguyên NGƯỢC NHAU:
#
#   Backend (phục vụ truy vấn)        Crawler worker (tiêu thụ Kafka)
#   ────────────────────────────      ──────────────────────────────────
#   Nút thắt: CPU + bộ nhớ            Nút thắt: chờ mạng
#   Chỉ mục đảo nằm trong RAM         Gần như không giữ trạng thái
#   Co giãn theo lưu lượng truy vấn   Co giãn theo ĐỘ DÀI HÀNG ĐỢI
#   Nhạy độ trễ (người dùng đang chờ) Chịu được độ trễ (chạy nền)
#
# Nhốt chung một tiến trình thì mỗi lựa chọn đều phải thoả hiệp: một đợt crawl
# làm chậm mọi truy vấn, và muốn nhân bản để chịu tải crawl thì phải nhân bản
# cả chỉ mục — tốn RAM cho một thứ không ai dùng tới.
#
# CÙNG MỘT ẢNH, khác vai, vai do biến môi trường quyết định. Đây là nguyên tắc
# "một ảnh chạy ở mọi môi trường" mà configmap.yaml đã nêu, áp cho hai vai trò
# của cùng một hệ thống: một ảnh đã qua kiểm thử, một quy trình dựng, một nơi
# để vá lỗi.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vnsearch-crawler-worker
  namespace: vnsearch
  labels:
    app.kubernetes.io/name: vnsearch
    app.kubernetes.io/component: crawler-worker
spec:
  # Deployment chứ không phải StatefulSet: worker KHÔNG giữ danh tính nào.
  # Kafka tự giao phân hoạch cho consumer đang sống, nên một Pod mới nhận việc
  # ngay mà không cần biết Pod chết trước đó là ai.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vnsearch
      app.kubernetes.io/component: crawler-worker
  strategy:
    # maxUnavailable: 0 — Pod mới phải sẵn sàng trước khi Pod cũ bị xoá.
    #
    # Quan trọng hơn vẻ ngoài: mỗi lần một consumer rời nhóm, Kafka phải CÂN
    # BẰNG LẠI, và trong lúc cân bằng thì cả nhóm ngừng tiêu thụ. Gỡ nhiều Pod
    # cùng lúc nghĩa là nhiều lần cân bằng liên tiếp, và độ trễ tiêu thụ vọt
    # lên trong suốt quá trình triển khai.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vnsearch
        app.kubernetes.io/component: crawler-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # 90 giây để rời nhóm consumer một cách tử tế: chốt offset của những
      # thông điệp đang xử lý dở, rồi báo cho nhóm biết mình đi. Bị giết đột
      # ngột thì Kafka phải chờ hết `session.timeout.ms` mới nhận ra, và trong
      # khoảng đó các phân hoạch của Pod này không ai xử lý.
      terminationGracePeriodSeconds: 90

      containers:
        - name: crawler-worker
          image: ghcr.io/kietanhcs/search-engine:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: vnsearch-config
            - secretRef:
                name: vnsearch-secret

          env:
            # HAI dòng này là toàn bộ khác biệt về VAI so với backend.
            - name: APP_CRAWLER_BUS
              value: kafka
            - name: APP_CRAWLER_KAFKA_BOOTSTRAP
              value: vnsearch-kafka-0.vnsearch-kafka.vnsearch.svc.cluster.local:9092

            # Tải ảnh vẫn TẮT ở lớp nền. Bật nó là mở lại đúng đường SSRF mà
            # HtmlDownloader đã phải vá, và nhân băng thông lên nhiều lần —
            # xem Javadoc của ImageFound. Overlay nào cần thì tự bật, có ý thức.
            - name: APP_CRAWLER_IMAGES_DOWNLOAD
              value: "false"

          # KHÔNG có readinessProbe kiểu backend.
          #
          # Worker này không phục vụ request nào, không đứng sau Service nào,
          # nên "sẵn sàng nhận request" là câu hỏi vô nghĩa. Cái cần biết là
          # "tiến trình còn đáp ứng không" — và đó đúng là câu mà
          # /actuator/health/liveness trả lời.
          #
          # Dùng nhầm /api/health ở đây sẽ hỏng theo cách tinh vi: endpoint đó
          # trả 503 khi chỉ mục rỗng, mà worker thì KHÔNG BAO GIỜ lập chỉ mục —
          # nên nó bị giết vĩnh viễn ngay sau khi khởi động.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              # Thấp hơn backend nhiều: worker không giữ chỉ mục đảo. Phần bộ
              # nhớ đáng kể nhất là lô thông điệp Kafka đang xử lý — đã chặn
              # bằng max.poll.records=50 trong KafkaCrawlConfig.
              memory: 512Mi
            limits:
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
# ═══════════════════════════════════════════════════════════════════════════
# CO GIÃN THEO ĐỘ DÀI HÀNG ĐỢI, KHÔNG PHẢI THEO CPU
# ═══════════════════════════════════════════════════════════════════════════
#
# Đây là chỗ khác biệt bản chất so với HPA của backend, và là lý do tồn tại
# của KEDA trong hệ thống này.
#
# Worker dành phần lớn thời gian CHỜ MẠNG — tải ảnh, phân giải DNS. CPU của nó
# gần bằng 0 ngay cả khi nó đang tụt lại xa. Một HPA theo CPU sẽ thấy "tải
# thấp" và không bao giờ nhân bản, trong khi độ trễ tiêu thụ dài ra vô hạn.
#
# Thang đo ĐÚNG là số thông điệp còn nợ:
#
#     CPU thấp     +  hàng đợi dài   ->  CẦN thêm worker   (HPA/CPU: bỏ lỡ)
#     CPU cao      +  hàng đợi rỗng  ->  KHÔNG cần thêm    (HPA/CPU: nhân bản thừa)
#
# TRẦN 12 KHÔNG PHẢI CON SỐ TUỲ TIỆN. Kafka giao mỗi phân hoạch cho đúng MỘT
# consumer trong một group, nên bản sao thứ 13 sẽ nằm không, tiêu tài nguyên
# mà không nhận việc. 12 chính là app.crawler.kafka.partitions.
#
# Muốn vượt 12 thì phải tăng số phân hoạch — NHƯNG đọc Javadoc của
# DiscoveredUrl trước: hàm băm của Kafka là murmur2(key) % numPartitions, nên
# đổi mẫu số làm mọi host chuyển sang phân hoạch khác, và bộ lọc Bloom chống
# trùng theo host mất tính đúng.
#
# CÀI KEDA:  helm repo add kedacore https://kedacore.github.io/charts
#            helm install keda kedacore/keda -n keda --create-namespace
#
# Không có KEDA thì bỏ tài nguyên này đi — Deployment ở trên vẫn chạy với số
# bản sao cố định. Overlay dev làm đúng như vậy.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vnsearch-crawler-worker
  namespace: vnsearch
  labels:
    app.kubernetes.io/name: vnsearch
    app.kubernetes.io/component: crawler-worker
spec:
  scaleTargetRef:
    name: vnsearch-crawler-worker

  # KHÔNG về 0. Về 0 thì không consumer nào giữ phân hoạch, và mỗi lần có việc
  # trở lại là một lần cân bằng nhóm cộng một lần khởi động JVM — khoảng 40
  # giây trước khi thông điệp đầu tiên được xử lý. Giữ tối thiểu 1 rẻ hơn.
  minReplicaCount: 1
  maxReplicaCount: 12

  pollingInterval: 30
  # Chờ 5 phút trước khi thu nhỏ. Mỗi lần bớt một Pod là một lần cân bằng
  # nhóm, và trong lúc cân bằng thì CẢ NHÓM ngừng tiêu thụ. Thu nhỏ hấp tấp
  # khiến hệ thống dao động và tiêu thụ chậm đi thay vì nhanh lên.
  cooldownPeriod: 300

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: vnsearch-kafka-0.vnsearch-kafka.vnsearch.svc.cluster.local:9092
        consumerGroup: vnsearch-url-extractor
        topic: vnsearch.pages
        # Mỗi bản sao gánh 1.000 thông điệp nợ. Lag 5.000 -> 5 bản sao.
        lagThreshold: "1000"
        # Không kích hoạt cho đến khi nợ quá 100: một dao động nhỏ không đáng
        # để dựng thêm Pod.
        activationLagThreshold: "100"
        offsetResetPolicy: earliest

---
# Giữ ít nhất một worker sống qua các thao tác TỰ NGUYỆN của cụm (nâng cấp
# node, rút node đi bảo trì).
#
# maxUnavailable thay vì minAvailable: số bản sao ở đây do KEDA điều khiển và
# thay đổi liên tục. `minAvailable: 1` trên một Deployment đang co về 1 bản sao
# sẽ chặn cứng `kubectl drain`; `maxUnavailable: 1` diễn đạt đúng ý định —
# "mỗi lần chỉ được gỡ một" — bất kể đang có bao nhiêu bản.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vnsearch-crawler-worker
  namespace: vnsearch
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vnsearch
      app.kubernetes.io/component: crawler-worker
