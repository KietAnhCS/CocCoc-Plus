apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloads-service
  namespace: vnsearch
  labels:
    app.kubernetes.io/name: vnsearch
    app.kubernetes.io/component: downloads-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vnsearch
      app.kubernetes.io/component: downloads-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vnsearch
        app.kubernetes.io/component: downloads-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: downloads-service
          image: ghcr.io/kietanhcs/search-engine/downloads-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: vnsearch-config
          env:
            - name: SERVER_PORT
              value: "8086"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vnsearch-secret
                  key: ADMIN_API_KEY
            - name: DOWNLOADS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vnsearch-secret
                  key: DOWNLOADS_DB_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: downloads-service
  namespace: vnsearch
  labels:
    app.kubernetes.io/name: vnsearch
    app.kubernetes.io/component: downloads-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vnsearch
    app.kubernetes.io/component: downloads-service
  ports:
    - name: http
      port: 8086
      targetPort: http
