apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vnsearch

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - mongo.yaml
  - api-gateway.yaml
  - auth-service.yaml
  - search-service.yaml
  - crawler-service.yaml
  - analytics-service.yaml
  - history-service.yaml
  - downloads-service.yaml
  - settings-service.yaml
  - football-service.yaml
  - ingress.yaml
  - network-policy.yaml

# schema.sql là bản sao của backend/libs/core/src/main/resources/db/schema.sql;
# CI có bước `diff` chặn hai bản lệch nhau.
configMapGenerator:
  - name: vnsearch-db-init
    files:
      - 00-init-db.sh=init-db.sh
      - 01-schema.sql=schema.sql

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: vnsearch
      app.kubernetes.io/managed-by: kustomize
