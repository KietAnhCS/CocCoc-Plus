# Lớp NỀN — phần cấu hình chung cho mọi môi trường.
#
# Vì sao Kustomize chứ không phải Helm: Kustomize nằm sẵn trong kubectl
# (`kubectl apply -k`), không phải cài thêm gì, và nó làm việc trên YAML thật
# chứ không phải trên khuôn mẫu chuỗi. Một tệp YAML Helm lỗi cú pháp chỉ lộ ra
# sau khi kết xuất; ở đây tệp nền luôn là YAML hợp lệ, đọc và kiểm tra được
# ngay. Helm mạnh hơn khi cần ĐÓNG GÓI để người khác cài — đó không phải bài
# toán ở đây.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vnsearch

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - backend.yaml
  - ingress.yaml

# Bản sao của search-engine/src/main/resources/db/schema.sql.
# Kustomize không cho tham chiếu tệp nằm ngoài thư mục gốc, nên phải chép.
# CI có bước `diff` chặn hai bản lệch nhau.
configMapGenerator:
  - name: vnsearch-db-schema
    files:
      - 01-schema.sql=schema.sql

# Tắt hậu tố băm cho ConfigMap lược đồ: nó chỉ được đọc MỘT lần lúc initdb,
# nên việc đổi tên theo nội dung không mang lại lợi ích gì mà chỉ làm
# StatefulSet tham chiếu tới một tên không đoán trước được.
generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: vnsearch
      app.kubernetes.io/managed-by: kustomize
