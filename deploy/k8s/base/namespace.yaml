apiVersion: v1
kind: Namespace
metadata:
  name: vnsearch
  labels:
    app.kubernetes.io/name: vnsearch
    # Bật Pod Security Admission ở mức `restricted` — mức chặt nhất trong ba
    # mức có sẵn của Kubernetes. Nó ép mọi Pod trong namespace phải: chạy
    # không phải root, không nâng quyền, bỏ hết Linux capability, và khai báo
    # seccomp profile.
    #
    # Đặt ở NAMESPACE chứ không phải ở từng Pod là điều quan trọng: một Pod
    # quên khai báo securityContext sẽ bị TỪ CHỐI tạo, thay vì lặng lẽ chạy
    # bằng root. Cấu hình an toàn phải là mặc định, không phải là thứ phải nhớ.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
