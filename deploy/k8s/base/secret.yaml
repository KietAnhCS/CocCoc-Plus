# CHỖ GIỮ CHỖ, KHÔNG PHẢI BÍ MẬT THẬT.
#
# ĐỌC KỸ TRƯỚC KHI DÙNG. Giá trị trong tệp này chỉ để cụm dev trên máy cá nhân
# khởi động được. Chúng nằm trong Git, nên chúng KHÔNG phải bí mật — bất kỳ ai
# clone repo đều đọc được.
#
# Vì sao `stringData` chứ không phải `data`: `data` đòi base64, và base64 KHÔNG
# phải mã hoá. Nó chỉ làm giá trị trông có vẻ bí mật với người đọc lướt, và đó
# là điều tệ hơn cả việc để nguyên văn — nó tạo cảm giác an toàn sai. Để nguyên
# văn thì không ai nhầm lẫn về bản chất.
#
# Ở MÔI TRƯỜNG THẬT thì dùng một trong các cách sau, KHÔNG dùng tệp này:
#
#   - External Secrets Operator, lấy từ AWS Secrets Manager / Vault / GCP
#   - Sealed Secrets (bitnami) — mã hoá được, commit vào Git an toàn
#   - SOPS + age — mã hoá tệp tại chỗ, hợp với repo nhỏ
#   - `kubectl create secret` chạy tay, không commit gì cả
#
# Overlay `prod` KHÔNG dùng tệp này (xem overlays/prod/kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: vnsearch-secret
  namespace: vnsearch
type: Opaque
stringData:
  # Khoá quản trị cho /api/admin/**. Ứng dụng từ chối khởi động nếu thiếu, và
  # yêu cầu tối thiểu 16 ký tự — xem SecurityConfig.
  # Sinh khoá thật: openssl rand -hex 32
  ADMIN_API_KEY: "dev-only-key-doi-truoc-khi-chay-that"
  POSTGRES_PASSWORD: "dev-only-password"
