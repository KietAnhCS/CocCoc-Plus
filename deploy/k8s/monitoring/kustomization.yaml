# Lớp GIÁM SÁT — tách khỏi lớp nền, có chủ ý.
#
# ═══════════════════════════════════════════════════════════════════════════
# VÌ SAO KHÔNG NẰM TRONG base/
# ═══════════════════════════════════════════════════════════════════════════
#
# Hai tài nguyên ở đây (`ServiceMonitor`, `PrometheusRule`) là CRD do
# Prometheus Operator định nghĩa — chúng không có sẵn trong Kubernetes.
#
# Đưa chúng vào lớp nền thì mọi cụm chưa cài operator sẽ nhận:
#
#     error: unable to recognize "...": no matches for kind "ServiceMonitor"
#
# và `kubectl apply -k` thất bại TOÀN BỘ, kể cả những tài nguyên hoàn toàn
# hợp lệ đứng trước. Nghĩa là: thêm giám sát vào lớp nền sẽ làm hỏng việc
# triển khai ứng dụng trên mọi cụm chưa cài thêm gì.
#
# Nguyên tắc rút ra: lớp nền chỉ chứa thứ Kubernetes tự hiểu. Mọi thứ phụ
# thuộc một operator phải là lớp chọn thêm.
#
# ═══════════════════════════════════════════════════════════════════════════
# CÁCH DÙNG
# ═══════════════════════════════════════════════════════════════════════════
#
#   # 1. Cài Prometheus Operator (kèm luôn Grafana và Alertmanager)
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prom prometheus-community/kube-prometheus-stack \
#        -n monitoring --create-namespace
#
#   # 2. Áp lớp này
#   kubectl apply -k deploy/k8s/monitoring
#
# Ở docker-compose thì phần tương đương là `--profile monitoring`, và nó dùng
# đúng những quy tắc cảnh báo này (deploy/monitoring/alerts.yml). Hai đường
# triển khai, một bộ quy tắc.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vnsearch

resources:
  - servicemonitor.yaml
  - prometheusrule.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: vnsearch
      app.kubernetes.io/managed-by: kustomize
