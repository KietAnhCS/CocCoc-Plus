# ServiceMonitor cho Prometheus Operator. Mỗi service Java phơi số liệu ở
# /actuator/prometheus; nhãn `release` phải khớp tên bản cài kube-prometheus-stack.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  namespace: vnsearch
  labels:
    app.kubernetes.io/name: vnsearch
    app.kubernetes.io/component: api-gateway
    release: kube-prom
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vnsearch
      app.kubernetes.io/component: api-gateway
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s

