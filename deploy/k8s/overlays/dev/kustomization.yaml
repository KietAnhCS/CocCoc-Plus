# Overlay DEV — cụm kind trên máy cá nhân.
#
#   kubectl apply -k deploy/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vnsearch

resources:
  - ../../base

# Ảnh dựng cục bộ rồi nạp thẳng vào kind, không qua registry.
images:
  - name: ghcr.io/kietanhcs/search-engine/api-gateway
    newName: vnsearch/api-gateway
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/auth-service
    newName: vnsearch/auth-service
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/search-service
    newName: vnsearch/search-service
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/crawler-service
    newName: vnsearch/crawler-service
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/analytics-service
    newName: vnsearch/analytics-service
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/history-service
    newName: vnsearch/history-service
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/downloads-service
    newName: vnsearch/downloads-service
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/settings-service
    newName: vnsearch/settings-service
    newTag: dev
  - name: ghcr.io/kietanhcs/search-engine/football-service
    newName: vnsearch/football-service
    newTag: dev

patches:
  # Ổ đĩa nhỏ lại cho vừa máy cá nhân.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi

  - target:
      kind: StatefulSet
      name: mongo
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi

  - target:
      kind: ConfigMap
      name: vnsearch-config
    patch: |-
      - op: replace
        path: /data/APP_RANKING_SCORER
        value: tfidf
