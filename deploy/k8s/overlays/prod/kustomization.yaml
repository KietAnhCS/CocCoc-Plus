# Overlay PROD — cụm thật.
#
#   kubectl apply -k deploy/k8s/overlays/prod
#
# TRƯỚC KHI CHẠY, tạo Secret bằng tay. Overlay này cố ý không mang theo
# secret.yaml của lớp nền: giá trị trong tệp đó nằm trong Git.
#
#   kubectl create namespace vnsearch
#   kubectl -n vnsearch create secret generic vnsearch-secret \
#     --from-literal=ADMIN_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=AUTH_DB_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=DOWNLOADS_DB_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=SETTINGS_DB_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=FOOTBALL_API_KEY=""
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vnsearch

resources:
  - ../../base
  - scaling.yaml

patches:
  - target:
      kind: Secret
      name: vnsearch-secret
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: vnsearch-secret

  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vnsearch
                app.kubernetes.io/component: api-gateway

  - target:
      kind: Deployment
      name: search-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # Có Ingress đứng trước nên X-Forwarded-For lúc này đáng tin.
  - target:
      kind: ConfigMap
      name: vnsearch-config
    patch: |-
      - op: add
        path: /data/APP_SECURITY_TRUST_PROXY
        value: "true"

# Ảnh phải được ghim theo digest ở môi trường thật; thẻ dưới đây chỉ là mặc
# định để manifest luôn dựng được.
images:
  - name: ghcr.io/kietanhcs/search-engine/api-gateway
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/auth-service
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/search-service
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/crawler-service
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/analytics-service
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/history-service
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/downloads-service
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/settings-service
    newTag: v1.0.0
  - name: ghcr.io/kietanhcs/search-engine/football-service
    newTag: v1.0.0
