# Overlay PROD — cụm thật.
#
#   kubectl apply -k deploy/k8s/overlays/prod
#
# TRƯỚC KHI CHẠY, phải tạo Secret bằng tay. Overlay này CỐ Ý không mang theo
# secret.yaml của lớp nền: giá trị trong tệp đó nằm trong Git và chỉ dành cho
# dev. Cách để một bí mật dev lọt ra production là để nó có sẵn ở đó.
#
#   kubectl create namespace vnsearch
#   kubectl -n vnsearch create secret generic vnsearch-secret \
#     --from-literal=ADMIN_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#
# Ở quy mô lớn hơn thì thay bước trên bằng External Secrets Operator hoặc
# Sealed Secrets, để bí mật không bao giờ đi qua terminal của ai.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vnsearch

resources:
  - ../../base

# Bỏ secret.yaml của lớp nền — xem ghi chú trên.
patches:
  - target:
      kind: Secret
      name: vnsearch-secret
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: vnsearch-secret

  # Ba bản sao chứ không phải hai: với PodDisruptionBudget minAvailable 1, ba
  # bản cho phép mất một node vì bảo trì VÀ một Pod vì sự cố mà vẫn còn phục vụ.
  - target:
      kind: Deployment
      name: vnsearch-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      # Trải Pod ra nhiều node. Không có ràng buộc này, bộ lập lịch hoàn toàn
      # có thể xếp cả ba Pod lên cùng một node — và lúc đó ba bản sao chỉ là ba
      # lần cùng một điểm hỏng.
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vnsearch
                app.kubernetes.io/component: backend

  # Có Ingress đứng trước, nên X-Forwarded-For lúc này ĐÁNG tin. Ở dev thì
  # không, và bật nhầm khi không có proxy sẽ vô hiệu hoá hoàn toàn bộ giới hạn
  # tần suất — ai cũng tự khai được địa chỉ của mình.
  - target:
      kind: ConfigMap
      name: vnsearch-config
    patch: |-
      - op: add
        path: /data/APP_SECURITY_TRUST_PROXY
        value: "true"

# Ảnh phải được GHIM theo digest, không dùng thẻ `latest`.
#
# `latest` là một con trỏ di động: hai node kéo ảnh ở hai thời điểm khác nhau
# có thể chạy hai bản mã khác nhau, và không có cách nào biết bản đang chạy là
# bản nào. Digest là mã băm của chính nội dung ảnh — ghim nó là ghim đúng thứ
# đã được kiểm thử và đã được ký.
#
# Thay giá trị dưới đây bằng digest do release.yml in ra.
images:
  - name: ghcr.io/kietanhcs/search-engine
    newTag: v1.0.0
