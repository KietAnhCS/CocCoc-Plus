apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: vnsearch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service
  namespace: vnsearch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Mỗi Pod mới tốn tới 120 giây dựng lại chỉ mục, nên thu nhỏ phải chậm.
      stabilizationWindowSeconds: 900

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: vnsearch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vnsearch
      app.kubernetes.io/component: api-gateway

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search-service
  namespace: vnsearch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vnsearch
      app.kubernetes.io/component: search-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
  namespace: vnsearch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vnsearch
      app.kubernetes.io/component: auth-service
