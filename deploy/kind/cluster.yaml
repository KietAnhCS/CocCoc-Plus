# Cụm Kubernetes chạy trong Docker, dùng để học và để thử trước khi lên cụm thật.
#
# Vì sao kind chứ không phải minikube: kind dựng node bằng chính container
# Docker, nên nó nhẹ hơn, khởi động nhanh hơn, và quan trọng nhất — nó là thứ
# chính dự án Kubernetes dùng để chạy test của họ. Cùng một công cụ mà CI của
# nhiều công ty dùng để kiểm thử manifest.
#
#   kind create cluster --config deploy/kind/cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vnsearch

nodes:
  - role: control-plane
    # Nhãn này là điều kiện để bộ điều khiển ingress-nginx bản dành cho kind
    # chịu xếp lịch lên node. Thiếu nó, Pod ingress sẽ ở trạng thái Pending mãi
    # mà không có thông báo nào giải thích vì sao.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Mở cổng 80/443 của máy thật vào cụm, để `curl http://vnsearch.local`
      # chạy được mà không cần `kubectl port-forward`.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Hai node công nhân: đủ để thấy topologySpreadConstraints và
  # PodDisruptionBudget thực sự làm gì. Với một node duy nhất thì hai cơ chế đó
  # không quan sát được, và cả hai lại đúng là thứ cần chứng minh trong đồ án.
  - role: worker
  - role: worker
