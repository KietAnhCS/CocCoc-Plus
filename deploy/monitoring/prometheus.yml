# Prometheus — chặng còn thiếu trong chuỗi quan sát.
#
# VÌ SAO TỆP NÀY TỒN TẠI. `docs/CHAM-DIEM-STARTUP.md` mô tả đúng vấn đề:
#
#     Ứng dụng ──▶ /actuator/prometheus ──▶  ???  ──▶  ???  ──▶  ???
#        ✅              ✅                Prometheus  Grafana  Cảnh báo
#                                            ❌          ❌       ❌
#
# Ứng dụng đã phơi số liệu từ lâu, nhưng không có ai THU THẬP. Một thang đo
# không được thu thập là một thang đo không tồn tại: nó chỉ là một con số hiện
# ra khi có người gõ curl, và không ai gõ curl lúc 3 giờ sáng.
#
# Ba tệp khép lại chuỗi đó: tệp này (thu thập), alerts.yml (phát hiện), và
# grafana/ (nhìn).

global:
  # 15 giây: đủ dày để thấy một đợt tải nhấp nhô, đủ thưa để không tự biến
  # mình thành tải. Với 4 mục tiêu thì đây là chi phí không đáng kể.
  scrape_interval: 15s

  # Chu kỳ tính lại quy tắc cảnh báo. Bằng scrape_interval là hợp lý: tính lại
  # dày hơn tần suất có dữ liệu mới thì chỉ tốn CPU để ra đúng kết quả cũ.
  evaluation_interval: 15s

  # Nhãn gắn vào MỌI chuỗi. Cần khi nhiều môi trường đổ về một Prometheus —
  # không có nó thì cảnh báo không nói được nó đến từ dev hay production.
  external_labels:
    environment: local
    project: vnsearch

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # --- Backend Java: nguồn số liệu nghiệp vụ -------------------------------
  #
  # metrics_path KHÔNG phải mặc định /metrics. Spring Boot Actuator đặt ở
  # /actuator/prometheus, và quên dòng này là cách phổ biến nhất để có một
  # mục tiêu mãi mãi ở trạng thái DOWN mà không hiểu vì sao.
  #
  # Tên job giữ nguyên `vnsearch-backend` vì alerts.yml đang neo vào nó. Mục
  # tiêu là tên service trong mạng Compose, không phải Service của Kubernetes.
  - job_name: vnsearch-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - search-service:8082
          - analytics-service:8084
          - history-service:8085
          - downloads-service:8086
          - settings-service:8087
          - football-service:8090
        labels:
          component: backend

  # --- Crawler: tách thành job riêng ---------------------------------------
  #
  # Không gộp vào job trên: một cái phục vụ truy vấn, một cái chạy vòng lặp
  # thu thập. Trộn chúng vào một job làm mọi phép tổng hợp trở nên vô nghĩa.
  - job_name: vnsearch-crawler-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [crawler-service:8083]
        labels:
          component: crawler-worker

  # --- Kafka: độ trễ tiêu thụ ----------------------------------------------
  #
  # Chỉ có mục tiêu khi chạy `--profile kafka`. Không bật hồ sơ đó thì job này
  # ở trạng thái DOWN, và đó là đúng: bus mặc định là `memory`, không có
  # broker nào cả.
  #
  # Thang đo quan trọng nhất ở đây là `kafka_consumergroup_lag` — số thông
  # điệp một consumer group còn nợ.
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
        labels:
          component: kafka

  # --- Bản thân Prometheus -------------------------------------------------
  #
  # Ai canh người canh gác. Nếu Prometheus quá tải hoặc hết bộ nhớ thì mọi
  # cảnh báo khác im lặng — và im lặng thì trông y hệt "mọi thứ đều ổn".
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          component: monitoring
