# Chay ca backend + PostgreSQL bang MOT lenh:
#
#   docker compose up -d --build
#
# Backend phuc vu o http://localhost:8080. Frontend (Electron) chay rieng tren
# may that — xem run-frontend.bat — vi no la ung dung desktop co cua so, khong
# phai mot dich vu mang.
services:
  postgres:
    image: postgres:17-alpine
    container_name: vnsearch-postgres
    environment:
      POSTGRES_DB: vnsearch
      POSTGRES_USER: vnsearch
      POSTGRES_PASSWORD: vnsearch
      # Sắp xếp theo chuẩn C cho tốc độ; việc so khớp tiếng Việt do
      # VietnameseTokenizer tự cài đảm nhiệm chứ không dựa vào collation của DB.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./search-engine/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnsearch -d vnsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./search-engine
    container_name: vnsearch-backend
    depends_on:
      postgres:
        # Doi PostgreSQL THAT SU san sang, khong chi "container da khoi dong":
        # `depends_on` tran khong doi den luc Postgres nhan ket noi, nen backend
        # se hoi mot cong chua ai nghe roi lui ve nguon JSON mot cach nham lan.
        condition: service_healthy
    environment:
      # Bat PostgreSQL lam nguon corpus UU TIEN. An toan ngay ca khi CSDL con
      # rong: PostgresDocumentStore.isAvailable() tra ve false khi bang khong co
      # tai lieu nao, nen chuoi du phong tu lui ve JSON.
      APP_STORAGE_POSTGRES_ENABLED: "true"
      # `postgres` la ten dich vu trong mang noi bo cua compose, KHONG phai
      # localhost — localhost trong container la chinh container do.
      APP_STORAGE_POSTGRES_URL: jdbc:postgresql://postgres:5432/vnsearch
      APP_STORAGE_POSTGRES_USER: vnsearch
      APP_STORAGE_POSTGRES_PASSWORD: vnsearch
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Doi sang `bm25` de dung cau hinh dat MRR cao nhat (0,9093 so voi 0,8758)
      # — xem docs/EVALUATION.md.
      APP_RANKING_SCORER: tfidf
    ports:
      - "8080:8080"
    volumes:
      # Mount corpus va file chi muc tu may that. Nho vay:
      #   - corpus lon (data/crawled-multi.json) duoc dung neu co;
      #   - file chi muc dung san ghi ra day va SONG SOT qua cac lan tao lai
      #     container, nen lan khoi dong sau khong phai lap chi muc lai.
      - ./search-engine/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/admin/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Lap chi muc lan dau tren corpus 5.011 trang mat vai chuc giay; khong co
      # start_period thi healthcheck bao "unhealthy" trong khi backend van dang
      # khoi dong binh thuong.
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
