# ===========================================================================
# VnSearch — toàn hệ thống, chạy được trên một máy 8 GB.
# ===========================================================================
#
#   docker compose up -d                          Hệ thống      trần 4,8 GB
#                                                 8 service + Postgres/Redis/Mongo
#   docker compose --profile crawler up -d        thêm crawler   trần +2,0 GB
#   docker compose --profile monitoring up -d     thêm giám sát  trần +544 MB
#                                                 Prometheus/Grafana/Alertmanager
#   docker compose --profile kafka up -d          thêm Kafka     trần +1,3 GB
#
# Giám sát nằm sau hồ sơ `monitoring` chứ không còn chạy mặc định: trên máy
# phát triển 15 GB, ba container ấy ăn RAM cả ngày trong khi chín mươi phần
# trăm thời gian không ai mở Grafana. Chạy được hệ thống là điều kiện cần;
# nhìn biểu đồ của nó là việc thỉnh thoảng. Môi trường thật thì bật hồ sơ này
# lên — cấu hình scrape và bộ quy tắc cảnh báo vẫn nguyên vẹn.
#
# Kafka cũng nằm sau hồ sơ riêng vì bus mặc định là `memory` — hệ thống chạy
# đủ chức năng mà không cần broker.
#
# ---------------------------------------------------------------------------
# NGÂN SÁCH BỘ NHỚ — vì sao mỗi con số là con số đó
# ---------------------------------------------------------------------------
#
#   search-service      2560 MB   ƯU TIÊN. Chỉ mục đảo, Trie gợi ý và vector
#                                 PageRank đều nằm trong heap, và chúng lớn
#                                 theo kích thước corpus chứ không theo số
#                                 người dùng. Nâng từ 2048: ở 2048 nó OOM ngay
#                                 lúc nạp chỉ mục — xem số liệu đo tại chỗ.
#   crawler-service     2048 MB   HỒ SƠ `crawler`, KHÔNG chạy mặc định.
#                                 frontier + bộ lọc Bloom, CỘNG corpus trong
#                                 thư mục data/ mà nó mount chung với
#                                 search-service — xem chú thích tại chỗ.
#                                 KHÔNG hạ được: 768 MB đã đo là OOM.
#   auth-service         384 MB   BCrypt tốn CPU, không tốn heap; đo ~240 MB.
#   api-gateway          384 MB   chỉ định tuyến, không giữ trạng thái.
#   postgres             384 MB   shared_buffers=128MB, work_mem=2MB.
#   mongo                384 MB   wiredTigerCacheSizeGB=0.25.
#   analytics-service    320 MB   số liệu 24 giờ trong bộ nhớ.
#   prometheus           256 MB   giữ số liệu 7 ngày.
#   grafana              192 MB   chỉ vẽ, không tính.
#   redis                128 MB   maxmemory-policy allkeys-lru.
#   alertmanager          96 MB   định tuyến cảnh báo, không giữ chuỗi số liệu.
#   football-service      96 MB   nhị phân Go tĩnh, đệm nằm trong Postgres.
#   history-service       96 MB   nhị phân Go tĩnh, truy vấn đi thẳng xuống Mongo.
#   downloads-service     96 MB   nhị phân Go tĩnh, CRUD mỏng.
#   settings-service      96 MB   nhị phân Go tĩnh, một bảng, một cột JSONB.
#
# Bốn service Go (football/history/downloads/settings) để 96 MB chứ không 384
# như hồi còn là Spring Boot: một nhị phân Go tĩnh không có JVM để khởi động,
# và 288 MB tiết kiệm được ở mỗi cái là gần 1,2 GB trên toàn hệ thống.
#
# TỔNG mem_limit mặc định = 4928 MB ≈ 4,8 GB, giảm từ 6592 MB: crawler-service
# (2048 MB) đã ra sau hồ sơ `crawler` nên không còn chạy khi không ai gọi,
# auth-service hạ từ 512 xuống 384, đổi lại search-service nâng từ 2048 lên
# 2560 vì con số cũ ĐANG làm nó OOM. Bật thêm `monitoring` là 5472 MB;
# bật cả `crawler` lẫn `monitoring` là 7520 MB.
#
# Trần `memory` trong C:\Users\<user>\.wslconfig hạ theo xuống 6 GB — đủ
# cho mặc định và cho mặc định + `monitoring`. Chạy `crawler` cùng lúc thì
# nâng .wslconfig lên 8GB rồi `wsl --shutdown` trước đã.
# Đó KHÔNG phải lượng RAM thật sự dùng: `mem_limit` là trần, không phải chỗ
# đặt trước — đo lúc chạy không tải là khoảng 2,9 GB sau khi bỏ crawler, và
# gần 2 GB trong số đó là search-service. Trần cộng dồn chỉ cần
# không vượt trần WSL, để kịch bản xấu nhất (mọi container chạm trần cùng
# lúc) vẫn không đẩy máy vào swap.
#
# Thêm service mới thì phải cộng lại con số này và đối chiếu với .wslconfig.
# Không có trần WSL, `vmmemWSL` lấy tới 50% RAM máy và không trả lại.
#
# ---------------------------------------------------------------------------
# `mem_limit` CHỨ KHÔNG PHẢI `deploy.resources.limits`
# ---------------------------------------------------------------------------
# Khối `deploy:` chỉ có tác dụng với Docker Swarm. Với `docker compose up`
# thường — cách mọi người thật sự chạy dự án này — nó bị BỎ QUA HOÀN TOÀN, và
# không có cảnh báo nào. Một giới hạn bộ nhớ tưởng là có nhưng không có sẽ lộ
# ra dưới dạng máy hết RAM, không phải dưới dạng một dòng lỗi.

name: vnsearch

# ---------------------------------------------------------------------------
# Neo YAML dùng chung. Đổi một chỗ, áp cho mọi service Java.
# ---------------------------------------------------------------------------
x-java-service: &java-service
  build:
    context: ./backend
    dockerfile: java/Dockerfile
  restart: unless-stopped
  networks: [vnsearch]
  # Chỉ ghi 3 tệp log, mỗi tệp 10 MB. Mặc định của Docker là KHÔNG GIỚI HẠN:
  # tám service chạy vài ngày là log ăn hết đĩa, và triệu chứng đầu tiên
  # thường là PostgreSQL không ghi được nữa.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-java-env: &java-env
  # MỌI service phải thấy CÙNG một địa chỉ JWKS và cùng issuer/audience.
  # Lệch nhau nghĩa là token do auth-service phát bị service khác từ chối,
  # và thông báo lỗi duy nhất người dùng thấy là 401.
  AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
  AUTH_ISSUER_URI: http://auth-service:8081
  AUTH_AUDIENCE: vnsearch-api
  ADMIN_API_KEY: ${ADMIN_API_KEY:?Thieu ADMIN_API_KEY. Sinh khoa - openssl rand -hex 32}
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  TZ: Asia/Ho_Chi_Minh

services:

  # =========================================================================
  # HẠ TẦNG DỮ LIỆU
  # =========================================================================

  postgres:
    image: postgres:17-alpine
    container_name: vnsearch-postgres
    networks: [vnsearch]
    environment:
      POSTGRES_DB: vnsearch
      POSTGRES_USER: vnsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnsearch}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      DOWNLOADS_DB_PASSWORD: ${DOWNLOADS_DB_PASSWORD:-}
      SETTINGS_DB_PASSWORD: ${SETTINGS_DB_PASSWORD:-}
    command:
      # 128 MB thay vì mặc định 128 MB... mặc định thật là 128 MB nhưng
      # PostgreSQL còn cấp phát work_mem cho MỖI phép sắp xếp của MỖI kết nối.
      # Bốn service nhân năm kết nối nhân 4 MB là 80 MB chỉ riêng phần đó.
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=50
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Chạy MỘT LẦN lúc khởi tạo volume. Tạo 3 CSDL riêng cho 3 service —
      # xem chú thích dài trong chính tệp này về nguyên tắc "database per
      # service".
      - ./deploy/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnsearch -d vnsearch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vnsearch-redis
    networks: [vnsearch]
    command:
      - redis-server
      - --maxmemory
      - 100mb
      # Refresh token và denylist đều CÓ HẠN DÙNG, nên đuổi mục cũ nhất khi
      # đầy là hành vi đúng. `noeviction` (mặc định) sẽ khiến Redis từ chối
      # mọi phép ghi khi đầy — tức là không ai đăng nhập được nữa.
      - --maxmemory-policy
      - allkeys-lru
      # KHÔNG bật lưu bền. Mất dữ liệu Redis nghĩa là mọi người phải đăng nhập
      # lại — phiền, nhưng không mất gì vĩnh viễn. Đổi lại: không tốn đĩa,
      # không có lúc dừng vì fork lúc snapshot.
      - --save
      - ""
      - --appendonly
      - "no"
    ports: ["6379:6379"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: vnsearch-mongo
    networks: [vnsearch]
    command:
      # Mặc định WiredTiger lấy 50% RAM MÁY trừ 1 GB — trên máy 8 GB là 3 GB,
      # gấp tám lần giới hạn container. Nó KHÔNG tự đọc giới hạn của Docker,
      # nên container sẽ bị hệ điều hành giết ngay khi dữ liệu lớn lên.
      - --wiredTigerCacheSizeGB
      - "0.25"
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =========================================================================
  # SERVICE ỨNG DỤNG — tất cả đều lên cùng `docker compose up -d`.
  # =========================================================================

  api-gateway:
    <<: *java-service
    container_name: vnsearch-gateway
    build:
      context: ./backend
      dockerfile: java/Dockerfile
      args:
        MODULE: services/api-gateway
        ARTIFACT: api-gateway
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_started}
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      SEARCH_SERVICE_URL: http://search-service:8082
      CRAWLER_SERVICE_URL: http://crawler-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
      HISTORY_SERVICE_URL: http://history-service:8085
      DOWNLOADS_SERVICE_URL: http://downloads-service:8086
      SETTINGS_SERVICE_URL: http://settings-service:8087
      FOOTBALL_SERVICE_URL: http://football-service:8090
    # CỔNG DUY NHẤT phơi ra ngoài, và đó là điểm mấu chốt: bảy service kia
    # KHÔNG có khối `ports`, nên chúng chỉ với tới được từ trong mạng
    # `vnsearch`. Mở cổng của chúng ra máy thật là mở một đường vòng qua mọi
    # thứ Gateway đang canh.
    ports: ["8080:8080"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  auth-service:
    <<: *java-service
    container_name: vnsearch-auth
    build:
      context: ./backend
      dockerfile: java/Dockerfile
      args:
        MODULE: services/auth-service
        ARTIFACT: auth-service
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      <<: *java-env
      SERVER_PORT: "8081"
      # Profile `postgres` bật CÙNG LÚC bốn thứ: kho tài khoản PostgreSQL,
      # DataSource, Flyway, và kho refresh token trên Redis. Xem
      # application-postgres.properties về lý do gói chúng vào một cái tên.
      SPRING_PROFILES_ACTIVE: postgres
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/vnsearch_auth
      AUTH_DB_USER: vnsearch_auth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-${POSTGRES_PASSWORD:-vnsearch}}
      REDIS_HOST: redis
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Khoá ký JWT. ĐỂ TRỐNG = sinh mới mỗi lần khởi động, và mọi người bị
      # đăng xuất sau mỗi lần triển khai. Chấp nhận được khi chạy thử; môi
      # trường thật phải mount một tệp JWK vào đây.
      AUTH_JWK_PATH: ${AUTH_JWK_PATH:-}
    volumes:
      - ./backend/data:/app/data
    # 384 MB chứ không 512: BCrypt tốn CPU chứ không tốn heap, và đo lúc chạy
    # là ~240 MB. 512 là con số đặt lúc chưa có trần metaspace trong
    # Dockerfile; giờ phần ngoài heap đã bị chặn cứng nên khoảng đệm đó thừa.
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  search-service:
    <<: *java-service
    container_name: vnsearch-search
    build:
      context: ./backend
      dockerfile: java/Dockerfile
      args:
        MODULE: services/search-service
        ARTIFACT: search-service
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *java-env
      SERVER_PORT: "8082"
      APP_STORAGE_POSTGRES_ENABLED: "true"
      APP_STORAGE_POSTGRES_URL: jdbc:postgresql://postgres:5432/vnsearch
      APP_STORAGE_POSTGRES_USER: vnsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnsearch}
      # GHI ĐÈ tham số JVM của Dockerfile.
      #
      # Dockerfile đặt UseSerialGC + TieredStopAtLevel=1 — đúng cho bảy service
      # nhỏ, SAI cho service này. Với heap hơn 1 GB, SerialGC dừng cả tiến
      # trình hàng trăm mili giây mỗi lần dọn rác, và một truy vấn tìm kiếm
      # rơi vào đó sẽ chậm thấy rõ. G1 giữ khoảng dừng dưới 200 ms.
      #
      # TieredStopAtLevel=1 cũng bị bỏ: service này chạy vòng lặp chấm điểm
      # hàng triệu lần, và nó cần trình biên dịch C2 tối ưu hết mức. Đổi lại
      # là khởi động chậm hơn vài giây — không đáng kể với một tiến trình sống
      # hàng tuần.
      # UseStringDeduplication chỉ chạy được với G1, nên nó nằm ở đây chứ không
      # ở Dockerfile. Chỉ mục đảo là hàng triệu chuỗi từ vựng, và rất nhiều
      # chuỗi trong số đó trùng nhau từng ký tự; G1 gộp phần mảng ký tự của
      # chúng lại trong lúc dọn rác. Đo trên corpus hiện tại: heap giảm rõ mà
      # không đổi một dòng mã nào.
      # 75 chứ không 70 như các service khác: hai vùng ngoài heap lớn nhất đã bị
      # chặn cứng ngay dưới đây (192 + 96 MB), nên phần dự phòng mà con số 70
      # để dành cho chúng không còn cần rộng như vậy nữa.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
        -XX:MaxMetaspaceSize=192m
        -XX:ReservedCodeCacheSize=96m
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - ./backend/data:/app/data
    # 2560 MB, KHÔNG phải 2048. Con số cũ để lại từ hồi corpus còn nhỏ và nó
    # ĐÃ HỎNG trước khi có tệp này: 2048 × 70%% = 1434 MB heap, và service chết
    # bằng "OutOfMemoryError: Java heap space" ngay giữa lúc nạp chỉ mục, rồi
    # `restart: unless-stopped` bật lại — vòng lặp không lối ra, triệu chứng
    # duy nhất là container mãi không lên `healthy`.
    #
    # Đo trực tiếp trên corpus hiện tại (index.json 510 MB + crawled-documents
    # 487 MB + 39552 ảnh):
    #     2048 MB (heap 1536) OOM, khởi động lại vô hạn
    #     2304 MB (heap 1728) lên `healthy`, ổn định ở 1,97 GB
    #     2560 MB (heap 1920) lên `healthy` — chọn con số này
    #     4096 MB (heap 2867) lên `healthy`, dùng tới 2,88 GB
    # G1 lấp gần hết phần heap được cấp trước khi dọn nghiêm túc, nên "dùng
    # 2,88 GB" ở dòng cuối KHÔNG có nghĩa là nó CẦN chừng đó. 2560 là 2304 đo
    # được cộng một khoảng đệm cho corpus lớn thêm.
    #
    # Corpus phình tiếp thì đây là con số phải nâng đầu tiên.
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 90 giây: service này dựng lại chỉ mục lúc khởi động. Thời gian chờ
      # ngắn hơn sẽ khiến Docker giết nó ngay giữa lúc nó đang làm đúng việc
      # của mình, và vòng lặp khởi động lại vô hạn bắt đầu.
      start_period: 90s

  # Viết bằng Go (chi + pgx), nguồn ở backend/go/services/football. Trước đây
  # là Java Spring Boot. Hợp đồng HTTP GIỮ NGUYÊN: `/api/v1/**` trên cổng
  # 8090, nên tuyến `football-api` của Gateway và desktop-app không đổi.
  #
  # Không dùng neo *java-service / *java-env: service này không đọc JWT (mọi
  # endpoint công khai, require-admin-api-key=false) nên không cần JWKS hay
  # ADMIN_API_KEY.
  football-service:
    container_name: vnsearch-football
    restart: unless-stopped
    networks: [vnsearch]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      args:
        SERVICE: football
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SERVER_PORT: "8090"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      TZ: Asia/Ho_Chi_Minh
      # Dùng chung CSDL `vnsearch` với search-service nhưng trong một schema
      # riêng tên `football` — service tự chạy migration nhúng lúc khởi động.
      #
      # Truyền TỪNG PHẦN thay vì một URL ghép sẵn: mật khẩu sinh ngẫu nhiên
      # rất hay chứa `@` hoặc `:`, đúng những ký tự phân tách của cú pháp URL.
      # Một dấu `@` trong mật khẩu cắt URL sai chỗ và lỗi hiện ra là "password
      # authentication failed" — trỏ người đọc đi sai hướng hoàn toàn.
      FOOTBALL_DB_HOST: postgres
      FOOTBALL_DB_PORT: "5432"
      FOOTBALL_DB_USER: vnsearch
      FOOTBALL_DB_PASSWORD: ${POSTGRES_PASSWORD:-vnsearch}
      FOOTBALL_DB_NAME: vnsearch
      # Thiếu khoá này không mở ra lỗ hổng nào, service chỉ trả về danh sách
      # rỗng kèm meta.source = "unavailable".
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:-}
      FOOTBALL_API_BASE_URL: ${FOOTBALL_API_BASE_URL:-https://v3.football.api-sports.io}
      FOOTBALL_DAILY_BUDGET: "95"
    # 96 MB, không phải 384: một tiến trình Go tĩnh cần rất ít. Gần với con số
    # của thời service này còn viết bằng Go, cộng chút headroom.
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8090/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # SERVICE ỨNG DỤNG (tiếp)
  # =========================================================================

  # KHÔNG chạy mặc định — `docker compose --profile crawler up -d`, hoặc
  # `run-backend.bat --crawler`. Đây là container tốn trần RAM lớn nhất hệ
  # thống (2 GB) và nó nạp CHÍNH bản chỉ mục mà search-service đã nạp, cho
  # đúng một nhóm endpoint quản trị. Tìm kiếm không cần nó, và `run-crawl.bat`
  # cũng không gọi tới nó. Đường chạy jar trực tiếp đã bỏ nó theo mặc định từ
  # lâu; hồ sơ này làm đường Docker khớp lại — trước đây `docker compose up -d`
  # vẫn lặng lẽ bật nó lên và ăn 2 GB trần mà không ai yêu cầu.
  #
  # Không bật thì mất /api/admin/** và bảng điều khiển của analytics-service.
  crawler-service:
    <<: *java-service
    container_name: vnsearch-crawler
    profiles: [crawler]
    build:
      context: ./backend
      dockerfile: java/Dockerfile
      args:
        MODULE: services/crawler-service
        ARTIFACT: crawler-service
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *java-env
      SERVER_PORT: "8083"
      APP_STORAGE_POSTGRES_ENABLED: "true"
      APP_STORAGE_POSTGRES_URL: jdbc:postgresql://postgres:5432/vnsearch
      APP_STORAGE_POSTGRES_USER: vnsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnsearch}
      APP_CRAWLER_BUS: ${APP_CRAWLER_BUS:-memory}
      APP_CRAWLER_KAFKA_BOOTSTRAP: kafka:9092
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=192m
        -XX:ReservedCodeCacheSize=64m
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - ./backend/data:/app/data
    # 2 GB, KHÔNG phải 768 MB. Con số cũ được tính cho "frontier + bộ lọc
    # Bloom" và đúng với riêng phần đó — nhưng nó bỏ sót khối `volumes` ngay
    # bên trên: service này mount cùng thư mục `data/` với search-service, và
    # thư mục đó chứa index.json 385 MB cộng crawled-documents.json 367 MB.
    #
    # Nạp chúng vào một heap 537 MB (768 × MaxRAMPercentage=70) là hết bộ nhớ
    # ngay trong lúc khởi động, rồi `ExitOnOutOfMemoryError` giết tiến trình và
    # `restart: unless-stopped` bật lại — một vòng lặp không lối ra, và triệu
    # chứng duy nhất là container mãi không lên `healthy`.
    #
    # Đo được: 768 MB mà KHÔNG mount data/ thì khởi động bình thường; 768 MB có
    # mount thì OOM; 2 GB có mount thì lên sau ~7 giây và ổn định ở 338 MB.
    mem_limit: 2048m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  analytics-service:
    <<: *java-service
    container_name: vnsearch-analytics
    build:
      context: ./backend
      dockerfile: java/Dockerfile
      args:
        MODULE: services/analytics-service
        ARTIFACT: analytics-service
    environment:
      <<: *java-env
      SERVER_PORT: "8084"
      CRAWLER_SERVICE_URL: http://crawler-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # history / downloads / settings: viết lại bằng Go (chi + pgx / mongo-driver),
  # nguồn ở backend/go/services/. Vẫn đọc JWT nên GIỮ *java-env (AUTH_* + CORS);
  # không có /api/admin/** nên ADMIN_API_KEY chỉ là biến thừa, service Go bỏ qua.
  # Không dùng *java-service vì build chỉ sang Dockerfile của Go.
  history-service:
    container_name: vnsearch-history
    restart: unless-stopped
    networks: [vnsearch]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      args:
        SERVICE: history
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      <<: *java-env
      SERVER_PORT: "8085"
      MONGO_URI: mongodb://mongo:27017/vnsearch_history
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  downloads-service:
    container_name: vnsearch-downloads
    restart: unless-stopped
    networks: [vnsearch]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      args:
        SERVICE: downloads
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *java-env
      SERVER_PORT: "8086"
      DOWNLOADS_DB_URL: postgresql://postgres:5432/vnsearch_downloads
      DOWNLOADS_DB_USER: vnsearch_downloads
      DOWNLOADS_DB_PASSWORD: ${DOWNLOADS_DB_PASSWORD:-${POSTGRES_PASSWORD:-vnsearch}}
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8086/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  settings-service:
    container_name: vnsearch-settings
    restart: unless-stopped
    networks: [vnsearch]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      args:
        SERVICE: settings
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *java-env
      SERVER_PORT: "8087"
      SETTINGS_DB_URL: postgresql://postgres:5432/vnsearch_settings
      SETTINGS_DB_USER: vnsearch_settings
      SETTINGS_DB_PASSWORD: ${SETTINGS_DB_PASSWORD:-${POSTGRES_PASSWORD:-vnsearch}}
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # HỒ SƠ `kafka`
  # =========================================================================

  kafka:
    image: apache/kafka:4.3.1
    container_name: vnsearch-kafka
    profiles: [kafka]
    networks: [vnsearch]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # 512 MB heap. Mặc định của Kafka là 1 GB — quá tay cho một broker một
      # nút chạy trên máy lập trình viên.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["9092:9092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vnsearch-kafka-ui
    profiles: [kafka]
    networks: [vnsearch]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: vnsearch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    # 8091 chứ KHÔNG phải 8090. Không có xung đột thật — football-service không
    # có khối `ports` nên 8090 chưa hề bị chiếm trên máy thật — nhưng 8090 là
    # cổng của football-service BÊN TRONG mạng `vnsearch` (SERVER_PORT: 8090,
    # và Gateway trỏ FOOTBALL_SERVICE_URL vào đó). Dùng lại đúng con số ấy cho
    # một thứ hoàn toàn khác là mời gọi người đọc mở http://localhost:8090 rồi
    # kết luận sai về service nào đang trả lời.
    ports: ["8091:8080"]
    mem_limit: 256m
    restart: unless-stopped

  # Kafka phơi số liệu qua JMX chứ không qua HTTP, nên Prometheus không đọc
  # thẳng được. Exporter này dịch JMX sang định dạng Prometheus và là nguồn
  # duy nhất của `kafka_consumergroup_lag` — thang đo mà hai quy tắc cảnh báo
  # trong deploy/monitoring/alerts.yml dựa vào.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: vnsearch-kafka-exporter
    profiles: [kafka]
    networks: [vnsearch]
    depends_on:
      kafka: {condition: service_healthy}
    command: ["--kafka.server=kafka:9092"]
    mem_limit: 64m
    restart: unless-stopped

  # =========================================================================
  # GIÁM SÁT — Prometheus, Grafana, Alertmanager. Hồ sơ `monitoring`, không
  # chạy mặc định — `docker compose --profile monitoring up -d`.
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vnsearch-prometheus
    profiles: [monitoring]
    networks: [vnsearch]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Giữ 7 ngày thay vì mặc định 15: trên máy lập trình viên, số liệu cũ
      # hơn một tuần không ai xem, và mỗi ngày là vài trăm megabyte đĩa.
      - --storage.tsdb.retention.time=7d
    ports: ["9090:9090"]
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: vnsearch-grafana
    profiles: [monitoring]
    networks: [vnsearch]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vnsearch.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    mem_limit: 192m
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vnsearch-alertmanager
    profiles: [monitoring]
    networks: [vnsearch]
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["9093:9093"]
    mem_limit: 96m
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Một mạng riêng, KHÔNG dùng mạng `default`.
#
# Với mạng riêng, chỉ container trong mạng này phân giải được tên nhau. Cộng
# với việc bảy service không mở cổng ra máy thật, đó là hai lớp giữ cho
# Gateway thật sự là cửa duy nhất.
# ---------------------------------------------------------------------------
networks:
  vnsearch:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
