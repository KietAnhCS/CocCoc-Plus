# ============================================================================
# auth-service :8081 — máy chủ uỷ quyền.
# ============================================================================
# Nạp cấu hình dùng chung TRƯỚC, rồi ghi đè những gì riêng của service này.
# Xem đầu tệp vnsearch-common.properties về lý do không đặt tên nó là
# application.properties.
spring.config.import=classpath:vnsearch-common.properties

# ---------------------------------------------------------------------------
# DẤU `#---` DƯỚI ĐÂY LÀ BẮT BUỘC, KHÔNG PHẢI TRANG TRÍ.
# ---------------------------------------------------------------------------
# Nó tách tệp thành HAI tài liệu cấu hình. Spring xử lý tài liệu theo thứ tự và
# tài liệu SAU thắng tài liệu TRƯỚC; tệp được `spring.config.import` nạp vào
# được chèn ngay dưới tài liệu đã khai báo lệnh import.
#
# Nghĩa là nếu mọi thứ nằm chung MỘT tài liệu như bản đầu tiên viết ở đây, thì
# thứ tự thật là:
#
#     [1] tài liệu này (mọi khoá của auth-service)
#     [2] vnsearch-common.properties        <- chèn vào đây, THẮNG [1]
#
# và mọi phép ghi đè của service bị nuốt trong im lặng. Đây là lỗi đã xảy ra
# thật: `spring.autoconfigure.exclude` của service bị bản dùng chung đè, nên
# phần loại trừ DataSource không có tác dụng và auth-service không khởi động
# nổi với thông báo "Failed to determine a suitable driver class" — một thông
# báo không hề nhắc tới thứ tự cấu hình.
#
# Tách ra thì thứ tự thành:
#
#     [1] tài liệu trên (chỉ có dòng import)
#     [2] vnsearch-common.properties
#     [3] tài liệu dưới (mọi khoá của auth-service)   <- THẮNG, đúng như mong đợi
#---

spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# --- Chuỗi bảo mật ---
# TẮT chuỗi mặc định của platform. auth-service vừa phát token vừa tiêu thụ
# token, nên nó cần luật riêng — xem AuthSecurityConfig.
app.security.default-chain=false

# --- Phát hành token ---
# `iss` trong mọi token, và cũng là gốc của các địa chỉ trong
# /.well-known/openid-configuration. Phải là địa chỉ mà CÁC SERVICE KHÁC dùng
# để gọi tới, không phải địa chỉ công khai của Gateway: chúng lấy JWKS qua
# mạng nội bộ.
app.auth.issuer=${AUTH_ISSUER_URI:http://auth-service:8081}
app.auth.audience=${AUTH_AUDIENCE:vnsearch-api}

# 15 phút. Đây là CỬA SỔ THIỆT HẠI TỐI ĐA khi một access token bị đánh cắp:
# token tự chứng thực nên không xoá được ở máy chủ, chỉ có thể chờ nó hết hạn
# (hoặc chặn bằng denylist, vốn tốn một lượt hỏi Redis cho mỗi request).
# Người dùng không thấy con số này — refresh token lo phần gia hạn ngầm.
app.auth.access-token-ttl=${AUTH_ACCESS_TTL:PT15M}

# 30 ngày: bao lâu thì phải gõ lại mật khẩu nếu không đăng nhập.
app.auth.refresh-token-ttl=${AUTH_REFRESH_TTL:P30D}

# Tệp JWK chứa khoá ký RSA.
#
# ĐỂ TRỐNG = sinh khoá mới mỗi lần khởi động. Chỉ dùng cho dev/test: mọi token
# hỏng sau mỗi lần khởi động lại, và nhiều bản sao sẽ từ chối token của nhau.
# Sinh khoá cho môi trường thật: xem docs/van-hanh/xoay-khoa-jwt.md
app.auth.jwk-path=${AUTH_JWK_PATH:}

# Kho refresh token: memory | redis. Xem Javadoc của hai bản cài đặt.
app.auth.refresh-store=${AUTH_REFRESH_STORE:memory}

# --- Kho tài khoản ---
# json | postgres. Xem AuthConfig.userStore.
app.auth.store=${AUTH_STORE:json}
app.auth.users-path=${AUTH_USERS_PATH:data/users.json}

# Tài khoản quản trị MỒI, tạo ở lần khởi động đầu nếu chưa tồn tại.
#
# KHÔNG có mật khẩu mặc định, và đó là có chủ ý. Ba phương án, hai bị loại:
#   - mật khẩu mặc định trong mã (admin/admin): mọi bản triển khai cùng một
#     mật khẩu ai cũng biết -> loại;
#   - người đăng ký ĐẦU TIÊN tự động thành admin: kẻ nào tìm thấy máy chủ
#     trước chủ nhân thì chiếm được quyền -> loại;
#   - biến môi trường, không mặc định: phải cấu hình thêm một bước -> CHỌN.
#
# Thiếu biến này thì service VẪN KHỞI ĐỘNG (chỉ cảnh báo) — khác ADMIN_API_KEY.
# Lý do: thiếu khoá API nghĩa là endpoint quản trị không có gì bảo vệ; còn
# thiếu tài khoản mồi chỉ nghĩa là chưa ai đăng nhập được bằng tài khoản.
app.auth.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Service này CÓ /api/admin/users/** — nâng được vai trò của bất kỳ ai lên
# ADMIN — nên khoá quản trị là bắt buộc.
app.security.require-admin-api-key=true

# --- CSDL ---
# MẶC ĐỊNH KHÔNG CÓ CSDL NÀO.
#
# `spring-boot-starter-jdbc` nằm trên classpath, nên Spring Boot sẽ cố dựng
# một DataSource ngay lúc khởi động và đổ với "Failed to determine a suitable
# driver class" khi không có URL. Chặn phần tự động cấu hình đó là cách duy
# nhất để service chạy được mà không cần PostgreSQL — điều kiện để
# `mvnw test` và `docker compose up` lần đầu không đòi hỏi gì thêm.
#
# Bật CSDL bằng profile `postgres` (xem application-postgres.properties):
#     SPRING_PROFILES_ACTIVE=postgres
# Profile đó gỡ ba dòng loại trừ dưới đây và bật Flyway.
#
# Dòng này GHI ĐÈ giá trị trong vnsearch-common.properties, nên phải chép lại
# cả phần loại trừ UserDetailsService của tệp kia — Spring KHÔNG hợp nhất hai
# danh sách, nó lấy danh sách của tệp ưu tiên cao hơn.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# --- Redis (kho refresh token) ---
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
# Không tự kết nối lúc khởi động khi đang dùng kho trong bộ nhớ: bean Redis
# vẫn được Spring Boot tạo ra, nhưng không ai gọi tới nó.
spring.data.redis.connect-timeout=2s

# --- Giới hạn tần suất ---
# CHẶT HƠN các service khác: đây là nơi người ta dò mật khẩu. 30 request/phút
# đủ rộng cho một người dùng thật (đăng nhập, gia hạn token, xem hồ sơ) và quá
# hẹp cho một vòng lặp dò.
app.security.rate-limit.requests-per-minute=${AUTH_RATE_LIMIT:30}
