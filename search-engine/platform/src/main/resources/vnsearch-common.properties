# ============================================================================
# Cấu hình dùng CHUNG cho mọi service Java của VnSearch.
# ============================================================================
#
# Tệp này KHÔNG được Spring nạp tự động — tên nó cố tình không phải
# `application.properties`. Mỗi service nạp nó bằng một dòng ở đầu
# `application.properties` của mình:
#
#     spring.config.import=classpath:vnsearch-common.properties
#
# VÌ SAO KHÔNG ĐẶT TÊN application.properties. Hai tệp cùng tên trên classpath
# thì Spring chỉ lấy tệp ĐẦU TIÊN tìm thấy, không hợp nhất hai tệp — nên tệp
# của service sẽ che hẳn tệp của platform, và mọi khoá không được chép lại đều
# biến mất trong im lặng. Đây là lỗi đã xảy ra thật ở cây mã này (CorsConfig
# không tìm thấy app.cors.allowed-origins). Đổi tên biến phép che thành phép
# hợp nhất có thứ tự: giá trị trong application.properties của service GHI ĐÈ
# giá trị ở đây, đúng như mong đợi.

# --- CORS ---
# Cho Electron renderer (dev server Vite). Ở môi trường thật, chỉ Gateway mới
# thật sự cần CORS; các service phía sau giữ cấu hình này để còn gọi thẳng
# được khi gỡ lỗi.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Bảo mật ---
# Khoá quản trị cho /api/admin/**. CÓ Ý để trống: service nào đặt
# app.security.require-admin-api-key=true sẽ không khởi động nếu thiếu.
#
#   Linux/macOS : export ADMIN_API_KEY=$(openssl rand -hex 32)
#   PowerShell  : $env:ADMIN_API_KEY = -join ((1..64) | % { '{0:x}' -f (Get-Random -Max 16) })
#
# KHÔNG đặt giá trị thật vào tệp này: tệp này được commit lên Git.
app.security.admin-api-key=${ADMIN_API_KEY:}

# Bí mật dùng chung giữa API Gateway và các service phía sau. Xem
# GatewayIdentityFilter: không có nó, bất kỳ ai chạm được tới cổng nội bộ đều
# tự xưng được là quản trị viên bằng một dòng curl.
#
# MỌI service (kể cả Gateway) phải thấy CÙNG một giá trị.
app.security.gateway-secret=${GATEWAY_SHARED_SECRET:}

# Giới hạn tần suất cho /api/*. Xem RateLimitFilter, và chú thích trong
# ServiceSecurityConfig về việc vì sao vẫn giữ hàng rào này khi Gateway đã có
# một hàng rào đứng trước.
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=120

# BẬT, khác với bản một khối.
#
# Trước đây giá trị này là `false` vì không có gì đứng trước ứng dụng, nên tin
# X-Forwarded-For đồng nghĩa với việc ai cũng tự khai địa chỉ của mình và giới
# hạn tần suất bị vô hiệu hoá hoàn toàn.
#
# Nay LUÔN có một proxy đứng trước: chính API Gateway. Không bật thì mọi
# request đều mang cùng một địa chỉ nguồn — địa chỉ của Gateway — và cả hệ
# thống dùng chung MỘT gáo token: một người dùng bấm nhanh sẽ chặn tất cả
# những người còn lại. Đó là lỗi tệ hơn.
app.security.trust-proxy=${APP_SECURITY_TRUST_PROXY:true}

# Tắt phần tự động cấu hình NGƯỜI DÙNG của Spring Security.
#
# Không tắt thì mỗi lần khởi động đều in ra:
#     Using generated security password: 4e8ed647-...
# Dòng log đó vừa là rác vừa GÂY HIỂU NHẦM: nó gợi ý rằng có một tài khoản
# đăng nhập dùng được, trong khi các service phía sau xác thực bằng header do
# Gateway truyền xuống và không có người dùng nào cả. Một dòng log nói sai sự
# thật còn tệ hơn không có.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Quan sát được ---
# Chỉ phơi ra 3 endpoint cần thiết. KHÔNG dùng "*": nhóm mặc định còn chứa
# /actuator/env (phơi bày mọi biến môi trường, KỂ CẢ ADMIN_API_KEY,
# GATEWAY_SHARED_SECRET và mật khẩu CSDL) và /actuator/heapdump (tải về toàn
# bộ bộ nhớ tiến trình).
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never

# Nhãn `application` nay lấy từ tên service, không còn là hằng số `vnsearch`.
# Với tám tiến trình cùng đẩy số liệu vào một Prometheus, một nhãn chung cho
# tất cả nghĩa là mọi biểu đồ đều là tổng của tám thứ khác nhau — và không
# biểu đồ nào trả lời được "service nào đang chậm".
management.metrics.tags.application=${spring.application.name}

# Độ trễ theo PHÂN VỊ, không chỉ trung bình.
#
# Trước đây chỉ có một con số: `timeTakenMs` trong thân phản hồi, và nó là độ
# trễ của ĐÚNG request đó. Không có gì trả lời được "hôm nay 1% người dùng chậm
# nhất phải chờ bao lâu" — mà đó mới là con số quyết định người ta có quay lại
# hay không. Trung bình giấu đi đúng phần đuôi: một hệ thống có trung bình
# 20 ms vẫn có thể có p99 là 3 giây.
#
# percentiles-histogram=true khiến Micrometer đẩy cả histogram sang Prometheus,
# nhờ vậy phân vị tính được GỘP LẠI từ nhiều bản sao. Nếu chỉ đẩy giá trị
# percentiles đã tính sẵn thì không thể cộng dồn: trung bình của hai p99 không
# phải là p99 của tổng.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Các mốc SLO. Mỗi mốc thêm một ô trong histogram, nên chỉ đặt những mốc thật sự
# sẽ được đọc — đây là ngưỡng cho cảnh báo "bao nhiêu phần trăm truy vấn dưới
# 200 ms", không phải để vẽ biểu đồ cho đẹp.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s
