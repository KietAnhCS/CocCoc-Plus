spring.application.name=search-engine
server.port=8080

# CORS cho Electron renderer (dev server Vite).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Bao mat ---
# Khoa quan tri cho /api/admin/**. CO Y de trong: SecurityConfig se khong cho
# ung dung khoi dong neu thieu. Dat qua bien moi truong ADMIN_API_KEY.
#
#   Linux/macOS : export ADMIN_API_KEY=$(openssl rand -hex 32)
#   PowerShell  : $env:ADMIN_API_KEY = -join ((1..64) | % { '{0:x}' -f (Get-Random -Max 16) })
#
# KHONG dat gia tri that vao tep nay: tep nay duoc commit len Git.
app.security.admin-api-key=${ADMIN_API_KEY:}

# Gioi han tan suat cho /api/*. Xem RateLimitFilter.
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=120

# Tat phan tu dong cau hinh NGUOI DUNG cua Spring Security.
#
# Khong tat thi moi lan khoi dong deu in ra:
#     Using generated security password: 4e8ed647-...
# Dong log do vua la rac vua GAY HIEU NHAM: no goi y rang co mot tai khoan
# dang nhap dung duoc, trong khi he thong nay xac thuc bang header X-API-Key va
# khong co nguoi dung nao ca. Mot dong log noi sai su that con te hon khong co.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Chi bat khi CO proxy tin cay dat truoc ung dung (nginx, load balancer).
# Bat khi khong co proxy = ai cung tu khai dia chi cua minh qua X-Forwarded-For,
# tuc bo gioi han tan suat bi vo hieu hoan toan.
app.security.trust-proxy=false

# --- Quan sat duoc ---
# Chi phoi ra 3 endpoint can thiet. KHONG dung "*": nhom mac dinh con chua
# /actuator/env (phoi bay moi bien moi truong, KE CA ADMIN_API_KEY va mat khau
# CSDL) va /actuator/heapdump (tai ve toan bo bo nho tien trinh).
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=vnsearch

# Độ trễ theo PHÂN VỊ, không chỉ trung bình.
#
# Trước đây chỉ có một con số: `timeTakenMs` trong thân phản hồi, và nó là độ
# trễ của ĐÚNG request đó. Không có gì trả lời được "hôm nay 1% người dùng chậm
# nhất phải chờ bao lâu" — mà đó mới là con số quyết định người ta có quay lại
# hay không. Trung bình giấu đi đúng phần đuôi: một hệ thống có trung bình
# 20 ms vẫn có thể có p99 là 3 giây.
#
# percentiles-histogram=true khiến Micrometer đẩy cả histogram sang Prometheus,
# nhờ vậy phân vị tính được GỘP LẠI từ nhiều bản sao. Nếu chỉ đẩy giá trị
# percentiles đã tính sẵn thì không thể cộng dồn: trung bình của hai p99 không
# phải là p99 của tổng.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Các mốc SLO. Mỗi mốc thêm một ô trong histogram, nên chỉ đặt những mốc thật sự
# sẽ được đọc — đây là ngưỡng cho cảnh báo "bao nhiêu phần trăm truy vấn dưới
# 200 ms", không phải để vẽ biểu đồ cho đẹp.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s

# --- Xep hang ---
# Scorer co so: tfidf | bm25 (xem ScorerFactory).
app.ranking.scorer=tfidf
app.ranking.bm25.k1=1.2
app.ranking.bm25.b=0.75
# Trong so cac tin hieu bo sung, ap bang Decorator. Dat 0 de tat han mot tin
# hieu — lop boc tuong ung se khong duoc tao, khong ton chi phi.
# (Truoc day o day con mot khoa `app.ranking.alpha` — no thuoc ve cong thuc
# cong tuyen tinh da bi Decorator thay the, va khong con ma nao doc no.)
app.ranking.beta=0.30
app.ranking.gamma=0.10

# --- Duong dan du lieu ---
app.index.data-path=data/index.json
app.crawler.data-path=data/crawled-documents.json
app.seed.data-path=data/seed-documents.json
app.search.cache-size=200

# --- Kho tai lieu ---
# Mac dinh tat de ung dung khoi dong duoc khi khong co CSDL. Bat len thi
# PostgreSQL thanh nguon uu tien, JSON lam du phong.
app.storage.postgres.enabled=${APP_STORAGE_POSTGRES_ENABLED:false}
app.storage.postgres.url=${APP_STORAGE_POSTGRES_URL:jdbc:postgresql://localhost:5432/vnsearch}
app.storage.postgres.user=${APP_STORAGE_POSTGRES_USER:vnsearch}
# Mac dinh `vnsearch` chi de chay demo cuc bo cho tien. Moi truong that PHAI
# dat POSTGRES_PASSWORD — xem .env.example.
app.storage.postgres.password=${POSTGRES_PASSWORD:vnsearch}

# --- Bus su kien crawler -> Modular Services (o "Kafka" trong so do) ---
#
# `memory`: ba Modular Service chay trong CUNG tien trinh, goi truc tiep.
#           Khong can broker. Day la mac dinh, va la che do ma
#           run-crawl.bat / MultiDomainCrawlRunner / toan bo test dung.
#
# `kafka` : ba service chay o tien trinh RIENG, co gian doc lap.
#           Can mot broker song o app.crawler.kafka.bootstrap-servers.
#
# VI SAO MAC DINH LA `memory`. Mot he thong khong khoi dong duoc khi thieu
# broker la mot he thong khong demo duoc, khong test duoc, va khong ai chay
# thu duoc. Kafka phai la thu BAT THEM khi can quy mo, khong phai dieu kien
# de chay duoc dong dau tien.
app.crawler.bus=${APP_CRAWLER_BUS:memory}

app.crawler.kafka.bootstrap-servers=${APP_CRAWLER_KAFKA_BOOTSTRAP:localhost:9092}

# Ten topic. Bon topic cho bon luong khac nhau — xem Javadoc cua
# com.vnsearch.crawler.bus.OutlinksExtracted ve viec vi sao `urls.discovered`
# va `outlinks` KHONG the gop lam mot.
app.crawler.kafka.topic.pages=vnsearch.pages
app.crawler.kafka.topic.urls=vnsearch.urls.discovered
app.crawler.kafka.topic.outlinks=vnsearch.outlinks
app.crawler.kafka.topic.images=vnsearch.images

# So phan hoach = TRAN so tien trinh xu ly song song cua mot consumer group.
# Kafka giao moi phan hoach cho dung MOT consumer, nen 12 phan hoach nghia la
# nhieu nhat 12 ban sao lam viec; ban thu 13 nam khong.
#
# Vi sao 12 chu khong phai 3: tang so phan hoach cua mot topic dang chay se
# LAM HONG phep phan hoach theo khoa — cung mot host se bat dau roi vao mot
# phan hoach khac, va bo loc Bloom theo host (xem DiscoveredUrl) mat tinh
# dung. Nen phai dat du rong ngay tu dau. 12 la boi so cua 1,2,3,4,6 nen
# chia deu duoc cho nhieu cau hinh so ban sao.
app.crawler.kafka.partitions=12
app.crawler.kafka.replication-factor=${APP_CRAWLER_KAFKA_REPLICATION:1}

# Nhom consumer. Moi Modular Service MOT nhom rieng — do la co che phat tan
# mot-toi-nhieu: ba nhom cung doc mot topic, moi nhom giu offset rieng, nen
# ca ba deu nhan duoc TOAN BO luong trang.
app.crawler.kafka.group.url-extractor=vnsearch-url-extractor
app.crawler.kafka.group.image-download=vnsearch-image-download
app.crawler.kafka.group.analytics=vnsearch-analytics
app.crawler.kafka.group.frontier=vnsearch-frontier-feeder

# --- Image Download Service ---
# Mac dinh CHI ghi sieu du lieu, khong tai noi dung anh. Ba ly do (chi phi
# bang thong, be mat SSRF, ban quyen) ghi trong Javadoc cua ImageFound.
app.crawler.images.download=${APP_CRAWLER_IMAGES_DOWNLOAD:false}
app.crawler.images.max-per-page=50
app.crawler.images.max-bytes=5242880
