spring.application.name=search-engine
server.port=8080

# CORS cho Electron renderer (dev server Vite + file://) - cau hinh thuc te
# se duoc them trong WebMvcConfigurer o PHASE 6 (REST API).
app.cors.allowed-origins=http://localhost:5173

# Trong so ket hop diem xep hang, xem ResultRanker (PHASE 5).
app.ranking.alpha=0.6
app.ranking.beta=0.3
app.ranking.gamma=0.1

# Duong dan file du lieu (PHASE 6)
app.index.data-path=data/index.json
app.crawler.data-path=data/crawled-documents.json
app.search.cache-size=200
